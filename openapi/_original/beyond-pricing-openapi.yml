  /api/v1/listings/{listing_id}/refresh/:
    post:
      operationId: refresh_listing_reservations
      description: |-
        Queue an asynchronous full refresh for the specified listing.

        This endpoint enqueues a `sync_listing` job (listing details and availability) followed by a `sync_reservations` job for the listing's primary channel listing, then recomputes the automatic base price. It returns immediately.

        Use the optional `sync-priority` query parameter to say how soon the refresh starts: `high` (the default) starts it as soon as Beyond can, `normal` can take longer to start when Beyond is busy. Send `normal` when you refresh many listings at once and none of them is urgent.

        ## Response Codes
        - **202**: Listing refresh accepted and queued
        - **400**: Validation error - invalid query parameter
        - **401**: Unauthorized - invalid or missing OAuth2 token
        - **403**: Forbidden - insufficient scope
        - **404**: Not found - listing not found or has no active channel listing
      summary: Refresh a listing (details and reservations)
      parameters:
      - in: path
        name: listing_id
        schema:
          type: integer
        required: true
      - in: query
        name: sync-priority
        schema:
          type: string
          enum:
          - high
          - normal
          default: high
        description: How soon the listing refresh starts. `high` (the default) starts
          it as soon as Beyond can. `normal` can take longer to start when Beyond
          is busy, which suits refreshing many listings at once. Any other value is
          a `400`.
      tags:
      - Listings
      security:
      - oauth2:
        - listings:write
      - personalAccessToken: []
      responses:
        '202':
          description: Listing refresh accepted
        '400':
          description: Validation error
        '401':
          description: Unauthorized - invalid or missing bearer token
        '403':
          description: Forbidden
        '404':
          description: Not found - resource does not exist
        '429':
          description: Rate limit exceeded
        '500':
          description: Internal server error
  /api/v1/reservations/:
    get:
      operationId: list_reservations
      description: |-
        List the reservations of your listings, ordered by check-in date.

        **Required scope:** `reservations:read`

        `filter[listing]` narrows the request to up to 100 listing ids; without
        it, every listing the token can see is read. An id the token cannot see
        returns no reservations. Each reservation's
        `listing` relationship is the listing it belongs to: a multi-unit
        listing also returns its units' reservations, each under the unit's
        own listing.

        A reservation is returned when its stay overlaps the window: it checks
        out on or after `filter[start-date]` (default: today, UTC) and checks in
        on or before `filter[end-date]` (default: no limit). Every status is
        returned unless `filter[status]` narrows it, so cancellations are
        visible.

        A listing connected through a PMS returns the reservations its PMS
        reports, once each, even when the listing is also connected to the
        channels the PMS distributes to.

        `rental-amount` and `adr` are in major units of the reservation's own
        `currency`, with no conversion.

        **Example:** `GET /api/v1/reservations/?filter[listing]=123,456&filter[start-date]=2026-11-01&filter[end-date]=2026-11-30&filter[status]=accepted`
      summary: List reservations
      parameters:
      - in: query
        name: filter[listing]
        schema:
          type: array
          items:
            type: string
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      - in: query
        name: filter[start-date]
        schema:
          type: string
          format: date
      - in: query
        name: filter[end-date]
        schema:
          type: string
          format: date
      - in: query
        name: filter[status]
        schema:
          type: array
          items:
            type:
            - string
            - 'null'
            enum:
            - accepted
            - canceled
            - unconfirmed
        description: |-
          Multiple values may be separated by commas.

          * `unconfirmed` - Unconfirmed
          * `accepted` - Accepted
          * `canceled` - Canceled
        explode: false
        style: form
      - name: page[number]
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page[size]
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: fields[reservations]
        schema:
          type: array
          items:
            type: string
            enum:
            - id
            - reference
            - channel
            - channel-id
            - status
            - is-owner-stay
            - booked-at
            - canceled-at
            - checkin-date
            - checkout-date
            - guests
            - currency
            - rental-amount
            - adr
            - listing
        description: endpoint return only specific fields in the response on a per-type
          basis by including a fields[TYPE] query parameter.
        explode: false
      tags:
      - Reservations
      security:
      - oauth2:
        - reservations:read
      - personalAccessToken: []
      responses:
        '200':
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/PaginatedReservationList'
              examples:
                Reservations:
                  value:
                    data:
                    - data:
                      - type: reservations
                        id: '48213377'
                        attributes:
                          reference: HMQ4X2ZK8A
                          channel: guesty
                          channel-id: 64f1c0a9e2
                          status: accepted
                          is-owner-stay: false
                          booked-at: '2026-09-02T14:31:07Z'
                          canceled-at: null
                          checkin-date: '2026-11-01'
                          checkout-date: '2026-11-05'
                          guests: 3
                          currency: USD
                          rental-amount: 820.0
                          adr: 205.0
                        relationships:
                          listing:
                            data:
                              type: listings
                              id: '123'
                      meta:
                        pagination:
                          page: 1
                          pages: 1
                          count: 1
                    links:
                      first: http://example.com/articles?page%5Bsize%5D=10&page%5Bnumber%5D=1
                      last: http://example.com/articles?page%5Bsize%5D=10&page%5Bnumber%5D=9
                      prev: http://example.com/articles?page%5Bsize%5D=10&page%5Bnumber%5D=1
                      next: http://example.com/articles?page%5Bsize%5D=10&page%5Bnumber%5D=3
                    meta:
                      pagination:
                        count: 42
                        page: 2
                        pages: 5
          description: ''
        '400':
          description: Validation error
        '401':
          description: Unauthorized - invalid or missing bearer token
        '403':
          description: Forbidden
        '429':
          description: Rate limit exceeded
        '500':
          description: Internal server error
