        time-based-adjustments:
          type: array
          items:
            $ref: '#/components/schemas/TimeBasedAdjustmentRequest'
          description: Lead-time price adjustments that apply within the seasonal range.
        exclude:
          type: boolean
          default: false
          description: Whether this range excludes seasonal lead-time price adjustments.
