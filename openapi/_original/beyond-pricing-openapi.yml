              description: Settings for Beyond Pricing's dynamic gap price adjustments.
            gap-price-adjustments:
              type: array
              items:
                $ref: '#/components/schemas/GapPriceAdjustment'
              description: Manual gap price adjustments, applied while dynamic gap
                price adjustments are disabled. A PATCH replaces the whole list; an
                empty list removes every rule. While dynamic gap price adjustments
                are enabled, the rules can be sent only unchanged.
            is-default:
              type: boolean
