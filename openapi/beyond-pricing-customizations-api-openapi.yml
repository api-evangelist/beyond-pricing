      type: object
      description: "A per-date manual price override for a range of dates.\n\nThe two override modes are mutually exclusive on any given date:\n\n* ``price`` pins the nightly price. Beyond's modeled price is discarded for\n  those dates until the override is removed.\n* ``percentage_adjustment`` adjusts the modeled price by a percentage and is\n  applied after every other pricing factor, so the price keeps moving with\n  the model.\n\nA row with neither value clears both overrides for the range."
