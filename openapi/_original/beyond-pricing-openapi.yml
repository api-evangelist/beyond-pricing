                      * `saturday` - saturday
                      * `sunday` - sunday
                  description: Weekdays guests are allowed to check in year-round.
                checkout-days:
                  type: array
                  items:
                    enum:
                    - monday
                    - tuesday
                    - wednesday
                    - thursday
                    - friday
                    - saturday
                    - sunday
                    type: string
                    description: |-
                      * `monday` - monday
                      * `tuesday` - tuesday
                      * `wednesday` - wednesday
                      * `thursday` - thursday
                      * `friday` - friday
                      * `saturday` - saturday
