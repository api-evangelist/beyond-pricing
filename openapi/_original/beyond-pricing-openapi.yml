        excluded-days-of-week:
          type: array
          items:
            $ref: '#/components/schemas/WeekdayEnum'
          description: 'Weekdays the rule skips: gap nights falling on them keep their
            unadjusted price. Omit to adjust every night of the gap.'
      required:
      - days
      - percentage
    GapPriceAdjustmentRequest:
      type: object
