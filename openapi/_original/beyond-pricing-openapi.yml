    Factor:
      type: object
      description: |-
        Serializer for a pricing factor within a calendar entry.

        Factors represent the individual components that influence the final price
        (e.g., seasonality, day-of-week, events).
      properties:
        key:
          type: string
          description: Factor identifier (e.g., 'seasonality', 'dow', 'event')
        order:
          type: integer
          description: Display order of the factor
        ratio:
          type: number
          format: double
          description: Factor's contribution as a ratio (e.g., -0.19 means -19%)
        amount:
          type: integer
          description: This factor's contribution to the modeled price, in the same
            currency units as `price`. Negative values lower the price. Factors whose
            effect rounds to less than 1 report 0. Amounts do not necessarily sum
            to (price - base price) because min/max price limits and final rounding
            are applied between factors and are not attributed to any single factor.
        reason:
          type:
          - string
          - 'null'
          description: Human-readable reason for the factor (e.g., event name). Omitted
            for factors that carry none, and null for an event with no name.
        event-impact:
          type: string
          description: 'Event impact level: ''low'', ''medium'', or ''high''. Only
            present for event factors.'
        metadata:
          allOf:
          - $ref: '#/components/schemas/FactorMetadata'
          description: Extra context specific to this factor's type. Omitted for factors
            that carry none.
      required:
      - amount
      - key
      - order
      - ratio
    FactorMetadata:
      type: object
      description: |-
        Serializer for the extra context some pricing factors carry.

        Every key is specific to one factor type and is omitted for the others:
        pacing factors carry `bedroom`, occupancy factors carry `listing-occupancy`
        and `market-occupancy`, and reputation factors carry `bad-review-date`.
      properties:
        bedroom:
          type: string
          description: Bedroom count the pacing factor was looked up under. Only present
            for `pacing_premium` and `pacing_discount` factors.
        listing-occupancy:
          type:
          - number
          - 'null'
          format: double
          description: The listing's occupancy over the factor's date range, as a
            percentage (e.g. `45.45` means 45.45%). Null when Beyond has no occupancy
            reading for the listing. Only present for `feature_occupancy_premium`
            and `feature_occupancy_discount` factors.
        market-occupancy:
          type:
          - number
          - 'null'
          format: double
          description: The listing's market's occupancy over the factor's date range,
            as a percentage (e.g. `27.32` means 27.32%). Null when Beyond has no occupancy
            reading for the market. Only present for `feature_occupancy_premium` and
            `feature_occupancy_discount` factors.
        disruption-label:
          type: string
          description: What disrupted travel in the market, as one of `storms`, `floods`,
            `fires`, `earthquakes`, `extreme_temperatures` or `conflict`. Only present
            for `bulk_cancellation` factors, and only when the cause was identified.
        bad-review-date:
          type: string
          description: Date of the review that triggered the discount (YYYY-MM-DD).
            Only present for `reputation_discount` factors, and only once the triggering
            review is known.
