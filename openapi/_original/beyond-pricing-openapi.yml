          failed, exhausted).
      - in: query
        name: filter[created-after]
        schema:
          type: string
          format: date-time
        description: Only return events created at or after this ISO 8601 timestamp
          (e.g. 2026-07-13T19:00:00Z).
      - in: query
        name: filter[created-before]
        schema:
          type: string
          format: date-time
        description: Only return events created at or before this ISO 8601 timestamp
          (e.g. 2026-07-13T20:00:00Z).
      - in: query
        name: include-body
        schema:
          type: boolean
        description: Include each event's full body (nested JSON) in the list. Off
          by default to keep the list light; enable it to reconcile and reprocess
          a range of events in a single call.
      - in: query
        name: fields[webhook-events]
        schema:
          type: array
