      enum:
      - market-insights
    MarketInsights:
      type: object
      required:
      - type
      - id
      additionalProperties: false
      properties:
        type:
          allOf:
          - $ref: '#/components/schemas/MarketInsightResourceTypeEnum'
          description: The [type](https://jsonapi.org/format/#document-resource-object-identification)
            member is used to describe resource objects that share common attributes
            and relationships.
        id:
          type: string
          description: '`{listing-id}:{compare-to}:{stay-date}`, e.g. `4033897:cluster:2026-03-01`.
            The benchmark half of a row depends on which listing was asked about and
            on `filter[compare-to]`, so both are part of the entry''s identity rather
            than the date alone.'
        attributes:
          type: object
          properties:
            date:
              type: string
              format: date
              description: Stay date this entry describes
            adj-occupancy:
              allOf:
              - $ref: '#/components/schemas/MarketInsightsComparison'
              description: 'Adjusted occupancy percentage: booked nights over *available*
                nights, so blocked and unavailable nights do not count against it.'
            occupancy:
              allOf:
              - $ref: '#/components/schemas/MarketInsightsComparison'
              description: 'Occupancy percentage over all nights, including nights
                that were not available to book. Its `benchmark` side is `null` whenever
                `adj-occupancy`''s is: the scraped series publishes only the adjusted
                denominator, so neither variant is verifiable without it.'
            average-booked-rate:
              allOf:
              - $ref: '#/components/schemas/MarketInsightsComparison'
              description: Average nightly rate actually booked, in `meta.currency`
                and in major units (`84.46` is 84.46, not 84 cents). `null` when there
                were no bookings on that date.
            average-posted-rate:
              allOf:
              - $ref: '#/components/schemas/MarketInsightsComparison'
              description: Average nightly rate on offer, in `meta.currency` and in
                major units, booked or not. Useful as a fallback where `average-booked-rate`
                is `null`.
          required:
          - date
          - adj-occupancy
          - occupancy
          - average-booked-rate
          - average-posted-rate
    MarketInsightsComparison:
      type: object
      description: |-
        One metric, on both sides of the comparison.

        `null` means the metric could not be computed for that date -- no
        availability, no bookings, or no scrape coverage. It never means zero;
        a real zero is returned as `0.0`.

        The two sides do not carry the same precision: `benchmark` is aggregated
        across the cohort and rounded to a whole number upstream, `listing` is
        exact. Do not read a sub-point difference between them as signal.
      properties:
        listing:
          type:
          - number
          - 'null'
          format: double
          description: Value for this listing, at full precision (aggregated over
            its sub-units for a multi-unit parent).
        benchmark:
          type:
          - number
          - 'null'
          format: double
          description: 'Value for the comparison cohort, from scraped OTA data. Which
            cohort that is follows `filter[compare-to]`: the listing''s neighborhood
            by default, or its whole market. Rounded to a whole number upstream, so
            it carries no decimals.'
      required:
      - benchmark
      - listing
