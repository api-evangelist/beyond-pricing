            and relationships.
        id:
          type: string
          description: Reservation identifier.
        attributes:
          type: object
          properties:
            reference:
              type:
              - string
              - 'null'
              description: Confirmation code the host sees in their PMS or on the
                channel. `null` when the channel does not send one.
            channel:
              type: string
              description: Integration the reservation was synced from, the same value
                as the listing's `channel-listings[].channel` (e.g. `airbnb_partner`,
                `guesty`).
            channel-id:
              type: string
              description: The reservation's identifier on that channel or PMS.
            status:
              enum:
              - unconfirmed
              - accepted
              - canceled
              type: string
              description: |-
                `accepted` for a confirmed stay, `canceled` for a confirmed stay that was later canceled, `unconfirmed` for a pending request or inquiry.

                * `unconfirmed` - unconfirmed
                * `accepted` - accepted
                * `canceled` - canceled
            is-owner-stay:
              type:
              - boolean
              - 'null'
              description: Whether the stay is an owner booking rather than a guest
                booking. `null` when the channel does not say.
            booked-at:
              type: string
              format: date-time
              description: When the reservation was accepted (UTC, ISO 8601).
            canceled-at:
              type:
              - string
              - 'null'
              format: date-time
              description: When the reservation was canceled (UTC, ISO 8601). `null`
                unless `status` is `canceled`, and also `null` when the channel does
                not send it.
            checkin-date:
              type: string
              format: date
              description: Arrival date (listing-local).
            checkout-date:
              type: string
              format: date
              description: Departure date (listing-local). The stay's last night is
                the day before.
            guests:
              type:
              - integer
              - 'null'
              description: Number of guests. `null` when the channel does not send
                it.
            currency:
              type: string
              description: 'ISO 4217 code of `rental-amount` and `adr`: the currency
                the reservation was booked in.'
            rental-amount:
              type:
              - number
              - 'null'
              format: double
              description: The stay's accommodation amount, the figure that compares
                with the nightly prices Beyond posts, in major units of `currency`
                (e.g. `820.5` is 820.50). `null` when the channel does not send it.
            adr:
              type: number
              format: double
              description: 'Average daily rate: `rental-amount` divided by the number
                of nights, in major units of `currency`. When `rental-amount` is `null`,
                Beyond derives it from the reservation''s other amounts.'
          required:
          - reference
          - channel
          - channel-id
          - status
          - is-owner-stay
          - booked-at
          - canceled-at
          - checkin-date
          - checkout-date
          - guests
          - currency
          - rental-amount
          - adr
        relationships:
          type: object
          properties:
            listing:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    id:
                      type: string
                    type:
                      type: string
