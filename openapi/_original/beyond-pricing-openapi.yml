    ListingBasePriceChangedEvent:
      type: object
      properties:
        meta:
          $ref: '#/components/schemas/_EventMeta'
        data:
          $ref: '#/components/schemas/ListingBasePriceChangedEventData'
      required:
      - data
      - meta
    ListingBasePriceChangedEventAttributes:
      type: object
      description: |-
        Dasherizes field names on output and un-dasherizes on input.

        Apply to nested (non-resource) serializers so their keys match
        the top-level JSON:API dasherized format. Top-level resource
        serializers must NOT use this mixin (the renderer handles them).
      properties:
        new-base-price:
          type: integer
          description: The listing's new user-set base price, in the listing currency.
            A whole number — the same integer the listings endpoint exposes as base-price
            (fractional amounts are truncated toward zero).
        old-base-price:
          type:
          - integer
          - 'null'
          description: The previous base price as a whole number, or null when the
            listing had no base price set before this change.
        new-currency:
          type:
          - string
          - 'null'
          description: ISO 4217 currency code the new base price is denominated in.
        old-currency:
          type:
          - string
          - 'null'
          description: ISO 4217 currency code of the previous base price. Differs
            from new-currency only when this change is a currency re-denomination;
            equal to new-currency for a plain price change.
        changed-at:
          type:
          - string
          - 'null'
          format: date-time
          description: UTC timestamp when the base price changed (RFC 3339).
        channel-listings:
          type: array
          items:
            $ref: '#/components/schemas/ListingBasePriceChangedEventChannelListings'
          description: The listing's active channel listings — one entry per channel
            the listing is syndicated to, mirroring channel-listings on the listing
            resource. Empty on a listing with no active channel listing.
        enabled:
          type: boolean
          description: Whether the listing has pricing enabled. true means the price
            change is live; false means it is speculative — e.g. a change to the algorithm's
            computed starting price on a listing that is not yet enabled, or a user
            editing the base price before turning syncing on.
        change-source:
          enum:
          - user
          - system
          type: string
          description: |-
            What moved the base price. 'user' — an authenticated actor (the Beyond API, the Beyond app, or an admin). 'system' — an automatic process (Beyond's algorithm computing a starting price, a scheduled auto-approved booking review, a background job). A change to the computed starting price is always 'system'.

            * `user` - user
            * `system` - system
        changed-by:
          type:
          - string
          - 'null'
          description: Email of the individual who made a 'user' change, when there
            is one to name. Null for every 'system' change, and for a 'user' change
            made by a machine — an app-level (client_credentials) Beyond API token
            acts for the account as a whole, not for a person. Changes made by Beyond
            staff on your behalf report 'support@beyondpricing.com'.
      required:
      - change-source
      - changed-at
      - changed-by
      - channel-listings
      - enabled
      - new-base-price
      - new-currency
      - old-base-price
      - old-currency
