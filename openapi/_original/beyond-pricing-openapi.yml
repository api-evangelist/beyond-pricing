  securitySchemes:
    oauth2:
      type: oauth2
      description: Use OAuth2 client credentials to mint an application token, or
        add `user_id` and optional `credential_id` in the Authorize dialog to request
        a user- or credential-scoped token.
      flows:
        clientCredentials:
          tokenUrl: /o/token/
          refreshUrl: /o/token/
          scopes:
            listings:read: Read listings
            listings:write: Modify listings
            reservations:read: Read reservations
            accounts:read: Read account information
            user:read: Read user information
            user:write: Create and modify users
            insights:read: Read market insights
            compsets:read: Read competitive set data
            neyoba:ask: Ask Neyoba
            beyond:read: Read listings, performance, and market data via the Beyond
              MCP server
            beyond:write: Modify pricing and listing settings via the Beyond MCP server
            beyond:skills: Load Beyond revenue-management skills via the Beyond MCP
              server
            beyond:usage: Read tool-call history and usage via the Beyond MCP server
            webhooks:read: Read delivered webhook events
            webhooks:write: Modify webhook configuration
    personalAccessToken:
      type: http
      scheme: bearer
      bearerFormat: PersonalAccessToken
      description: Paste a `bpat_...` personal access token. PATs use the same Bearer
        header as OAuth2 tokens and must still include the runtime-required scopes
        for each endpoint, even though OpenAPI cannot encode scopes for non-OAuth
        bearer schemes.
webhooks:
  accountCreated:
    post:
      description: |-
        Sent when the background listing sync that follows `POST /users/{user_id}/accounts/` reaches a terminal state — every listing on the account has been pulled from the channel and created in Beyond, or the sync failed.

        `succeeded` means the listings *exist*, not that they are priced. A listing becomes fully set up (base price computed) later, and each one emits its own `listing.created` event at that point.

        The event fires the same way whether the account was newly created or an existing, previously deleted account was revived; in the revive case the restored listings are counted in `nb-listings-synced`.

        Credential problems (invalid credentials, 2FA, channel outage) are reported synchronously on the `POST` response and emit no event.

        Verify the signature before parsing the body. See the [partner webhooks guide](../webhooks.md) for the verification recipe.
      summary: Managed account listing sync completed
      tags:
      - Webhooks
      requestBody:
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/AccountCreatedEvent'
        required: true
      responses:
        '200':
          description: Delivery acknowledged (any 2xx).
        '410':
          description: Endpoint permanently gone. Partners should respond 410 to disable
            redelivery; future iterations may auto-disable endpoints in this case.
  accountRefreshed:
    post:
      description: |-
        Sent when the background listing sync started by `POST /users/{user_id}/accounts/{account_id}/refresh/` reaches a terminal state — every listing the refresh considered has been re-pulled from the channel, or the sync failed.

        The event covers **listings only**. Reservations are refreshed by independent background jobs that outlive this event, so they are still in flight when it is delivered.

        Listings synced within the last `recent-sync-threshold-minutes` are skipped and are not counted in `nb-listings-synced`. A refresh that skips every listing is still `succeeded`, with `nb-listings-synced` of 0.

        Verify the signature before parsing the body. See the [partner webhooks guide](../webhooks.md) for the verification recipe.
      summary: Managed account refresh completed
      tags:
      - Webhooks
      requestBody:
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/AccountRefreshedEvent'
        required: true
      responses:
        '200':
          description: Delivery acknowledged (any 2xx).
        '410':
          description: Endpoint permanently gone. Partners should respond 410 to disable
            redelivery; future iterations may auto-disable endpoints in this case.
  listingBasePriceChanged:
    post:
      description: |-
        Sent whenever a listing's effective base price changes — through the Beyond API or any other Beyond surface. This covers the user-set base price changing, and — while no user base price is set — the starting base price Beyond's algorithm computes from the listing's characteristics changing from one value to another. The first-ever price (null → value) is delivered as `listing.created` instead, not here.

        `enabled` reports whether the listing has pricing enabled: use it to tell a live price change (`enabled: true`) from a speculative one (`enabled: false`, e.g. a computed starting price on a not-yet-enabled listing).

        `change-source` reports what moved the price: `user` for a change made by an authenticated actor (Beyond API, the Beyond app, or an admin), or `system` for one made by an automatic process (Beyond's algorithm computing a starting price, a scheduled auto-approved booking review, a background job). A change to the computed starting price is always `system`.

        `changed-by` names the individual behind a `user` change by email. It is null when no individual is responsible: every `system` change, and any change made by a machine — an app-level (`client_credentials`) Partners API token acts for the account as a whole, so it names no person. Changes made by Beyond staff on your behalf report `support@beyondpricing.com` rather than an internal address.

        The same `msg_id` is reused across delivery retries, so partners can dedupe on the `webhook-id` header. `old-base-price` is null the first time a base price is set. Verify the signature before parsing the body. See the [partner webhooks guide](../webhooks.md) for the verification recipe.
      summary: Listing base price changed
      tags:
      - Webhooks
      requestBody:
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/ListingBasePriceChangedEvent'
        required: true
      responses:
        '200':
          description: Delivery acknowledged (any 2xx).
        '410':
          description: Endpoint permanently gone. Partners should respond 410 to disable
            redelivery; future iterations may auto-disable endpoints in this case.
  listingCreated:
    post:
      description: |-
        Sent when a new listing owned by one of your users is fully set up — after Beyond has computed its initial base price — and when an attempt to set one up fails. Use it to learn about new listings, and about listings that need attention before they can be created, without polling. The same `msg_id` is reused across delivery retries, so partners can dedupe on the `webhook-id` header.

        With `status='succeeded'` the event fires when the listing's base price is first computed, and again — carrying `restored=true` — if the listing is ever removed and later comes back, so treat it as an upsert rather than an insert. With `status='failed'` it fires on every failing sync attempt — a listing whose channel setup stays broken repeats the event on each re-sync — carrying a human-readable `error`; the `listing` relationship and the listing attributes are null or omitted when the listing does not exist yet. Verify the signature before parsing the body. See the [partner webhooks guide](../webhooks.md) for the verification recipe.
      summary: Listing created
      tags:
      - Webhooks
      requestBody:
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/ListingCreatedEvent'
        required: true
      responses:
        '200':
          description: Delivery acknowledged (any 2xx).
        '410':
          description: Endpoint permanently gone. Partners should respond 410 to disable
            redelivery; future iterations may auto-disable endpoints in this case.
  listingInActiveMarketChanged:
    post:
      description: |-
        Sent when a listing's `in-active-market` attribute — the one the listings endpoint serves — changes. `in-active-market: true` guarantees the listing's calendar endpoint works and automated price refresh is on; while false the calendar may return 400 ("not yet clustered") and price refresh is off. Subscribe to it to learn when a listing you already received leaves or re-enters that ready state, without polling.

        It also fires once at creation for a listing created outside any active market (Beyond found no pricing cluster covering its location). Such a listing gets no `listing.created` event, so this is the first notification you receive about it — treat an unknown listing id as new rather than as an error.

        Otherwise the transition is rare: it happens when Beyond removes or re-assigns the listing's pricing cluster, or activates/deactivates the listing's market. It fires once per flip, in either direction — `in-active-market` carries the new value. A market-wide change (e.g. Beyond activating a market) reaches each listing on its next daily sync, so expect one event per affected listing spread over about a day. There is no failure variant. The same `msg_id` is reused across delivery retries, so partners can dedupe on the `webhook-id` header. Verify the signature before parsing the body. See the [partner webhooks guide](../webhooks.md) for the verification recipe.
      summary: Listing in-active-market changed
      tags:
      - Webhooks
      requestBody:
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/ListingInActiveMarketChangedEvent'
        required: true
      responses:
        '200':
          description: Delivery acknowledged (any 2xx).
        '410':
          description: Endpoint permanently gone. Partners should respond 410 to disable
            redelivery; future iterations may auto-disable endpoints in this case.
  listingRefreshed:
    post:
      description: |-
        Sent when a partner-triggered listing reservations refresh chain terminates — either both `sync_reservations` and `compute_abp_c` succeed, or any step fails. The same `msg_id` is reused across delivery retries, so partners can dedupe on the `webhook-id` header.

        Verify the signature before parsing the body. See the [partner webhooks guide](../webhooks.md) for the verification recipe.
      summary: Reservations refresh completed
      tags:
      - Webhooks
      requestBody:
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/ListingRefreshedEvent'
        required: true
      responses:
        '200':
          description: Delivery acknowledged (any 2xx).
        '410':
          description: Endpoint permanently gone. Partners should respond 410 to disable
            redelivery; future iterations may auto-disable endpoints in this case.
  webhookPing:
    post:
      description: |-
        Sent when a webhook URL is saved from the Beyond dashboard and whenever a test ping is requested there. It carries no domain change: answer any `2xx` and discard the body. The ping is signed like every other delivery, so a receiver that enforces signatures from day one passes verification.

        A ping is not gated on your event selection: it is sent even when `webhook.ping` is not in `subscribed-events`, because its purpose is to confirm the endpoint before any real event is delivered. Redirects are not followed and a non-`2xx` answer means the URL is not saved.

        Verify the signature before parsing the body. See the [partner webhooks guide](../webhooks.md) for the verification recipe.
      summary: Webhook endpoint verification ping
      tags:
      - Webhooks
      requestBody:
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/WebhookPingEvent'
        required: true
      responses:
        '200':
          description: Delivery acknowledged (any 2xx).
        '410':
          description: Endpoint permanently gone. Partners should respond 410 to disable
            redelivery; future iterations may auto-disable endpoints in this case.
