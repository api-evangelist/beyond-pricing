components:
  schemas:
    DynamicTimeBasedAdjustmentsRequest:
      type: object
      description: Settings for auto-generated time-based pricing recommendations.
      properties:
        enabled:
          type: boolean
          description: Whether dynamic time-based adjustments are enabled.
        tier:
          allOf:
          - $ref: '#/components/schemas/TierEnum'
          description: 'Optimization goal for recommendations. Must be `revenue`, `occupancy`, or `rate`.


            * `revenue` - revenue

            * `occupancy` - occupancy

            * `rate` - rate'
    SeasonalTimeBasedMinStay:
      type: object
      description: Lead-time min-stay rules limited to a seasonal date range.
      properties:
        start-date:
          type: string
          format: date
          description: First date the seasonal rule applies.
        end-date:
          type: string
          format: date
