      type: object
      properties:
        data:
          type: object
          required:
          - type
          - id
          additionalProperties: false
          properties:
            type:
              type: string
              description: The [type](https://jsonapi.org/format/#document-resource-object-identification) member is used to describe resource objects that share common attributes and relationships.
              enum:
              - occupancy-based-pricing-customizations
            id:
              type: string
              minLength: 1
              description: Customization resource identifier, returned as the listing ID.
            attributes:
              type: object
              properties:
                enabled:
                  type: boolean
                  description: Whether Beyond fine-tunes prices from the listing's occupancy compared with its market. The other fields take effect only while this is `true`, but are saved either way.
                tier:
                  enum:
                  - revenue
                  - occupancy
                  - rate
                  type: string
                  description: 'Strategy for occupancy-based discounts and premiums: `occupancy` favors deeper discounts, `rate` favors stronger premiums, and `revenue` balances both.


                    * `revenue` - revenue

                    * `occupancy` - occupancy

                    * `rate` - rate'
                min-factor:
                  type:
                  - number
                  - 'null'
                  format: double
                  maximum: 0
                  minimum: -1
                  description: Largest decrease occupancy-based pricing may apply, as a fraction between `-1` and `0` (`-0.05` caps decreases at 5%). `0` blocks decreases; `null` means no cap.
                max-factor:
                  type:
                  - number
                  - 'null'
                  format: double
                  maximum: 1
                  minimum: 0
                  description: Largest increase occupancy-based pricing may apply, as a fraction between `0` and `1` (`0.05` caps increases at 5%). `0` blocks increases; `null` means no cap.
                disabled-periods:
                  type: array
                  items:
                    $ref: '#/components/schemas/DisabledPeriodRequest'
                  description: Up to 50 non-overlapping date ranges during which occupancy-based pricing is skipped. A PATCH replaces the whole list; send `[]` to remove every period.
      required:
      - data
