                and relationships.
              enum:
              - occupancy-based-pricing-customizations
            id:
              type: string
              minLength: 1
              description: Customization resource identifier, returned as the listing
                ID.
            attributes:
              type: object
              properties:
                enabled:
                  type: boolean
                  description: Whether Beyond fine-tunes prices from the listing's
                    occupancy compared with its market. The other fields take effect
                    only while this is `true`, but are saved either way.
                tier:
                  enum:
                  - revenue
                  - occupancy
                  - rate
                  type: string
                  description: |-
                    Strategy for occupancy-based discounts and premiums: `occupancy` favors deeper discounts, `rate` favors stronger premiums, and `revenue` balances both.

                    * `revenue` - revenue
                    * `occupancy` - occupancy
                    * `rate` - rate
                min-factor:
                  type:
                  - number
                  - 'null'
                  format: double
                  maximum: 0
                  minimum: -1
