openapi: 3.2.0
info:
  title: Beyond Listings API
  version: 2.0.0
  description: Bearer-protected API for third-party integrations. Supports OAuth2 client credentials and personal access tokens. Follows JSON:API specification.
tags:
- name: Listings
paths:
  /api/v1/listings/:
    get:
      operationId: list_listings
      description: 'Retrieve a paginated list of all listings for the authenticated application.


        **Required scope:** `listings:read`


        **Pagination:** Use `page[number]` and `page[size]` query parameters.


        **Sorting:** Use `sort` query parameter with field names.

        Prefix with `-` for descending order.


        **Filtering:** Use `filter[field]` query parameters.


        **Compound documents:** Use `include` query parameter to include related resources.'
      summary: List all listings
      parameters:
      - name: sort
        required: false
        in: query
        description: '[list of fields to sort by](https://jsonapi.org/format/#fetching-sorting)'
        schema:
          type: array
          items:
            type: string
            enum:
            - created-at
            - -created-at
            - title
            - -title
            - city
            - -city
        explode: false
      - in: query
        name: filter[owner]
        schema:
          type: number
      - in: query
        name: filter[enabled]
        schema:
          type: boolean
      - in: query
        name: filter[name]
        schema:
          type: string
      - in: query
        name: filter[market]
        schema:
          type: string
      - in: query
        name: filter[bedrooms]
        schema:
          type: integer
      - in: query
        name: filter[in-active-market]
        schema:
          type: boolean
      - name: page[number]
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page[size]
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: include
        schema:
          type: array
          items:
            type: string
            enum:
            - owner
        description: include query parameter to allow the client to customize which related resources should be returned.
        explode: false
      - in: query
        name: fields[listings]
        schema:
          type: array
          items:
            type: string
            enum:
            - title
            - image
            - neighborhood
            - city
            - state
            - country
            - market
            - room-type
            - bedrooms
            - bathrooms
            - base-price
            - base-price-updated-at
            - min-price
            - min-price-updated-at
            - max-price
            - min-stay
            - extra-guest-fee
            - extra-guest-threshold
            - latitude
            - longitude
            - timezone
            - currency
            - in-active-market
            - enabled
            - address
            - created-at
            - owner
            - channel-listings
        description: endpoint return only specific fields in the response on a per-type basis by including a fields[TYPE] query parameter.
        explode: false
      tags:
      - Listings
      security:
      - oauth2:
        - listings:read
      - oauth2:
        - beyond:read
      - oauth2:
        - beyond:write
      - personalAccessToken: []
      responses:
        '200':
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/PaginatedListingList'
              examples:
                ListingList:
                  value:
                    data:
                    - data:
                      - type: listings
                        id: '123'
                        attributes:
                          title: Sunny 2BR near the beach
                          image: https://images.example.com/listing-123.jpg
                          neighborhood: Mission District
                          city: San Francisco
                          state: CA
                          country: US
                          market: San Francisco
                          room-type: entire_home
                          bedrooms: 2
                          bathrooms: '1.50'
                          base-price: 189
                          base-price-updated-at: '2026-07-02T09:15:00Z'
                          min-price: 95
                          min-price-updated-at: '2026-07-02T09:15:00Z'
                          max-price: null
                          min-stay: 2
                          extra-guest-fee: 25
                          extra-guest-threshold: 4
                          latitude: '37.77490000'
                          longitude: '-122.41940000'
                          timezone: America/Los_Angeles
                          currency: USD
                          in-active-market: true
                          enabled: true
                          address: 123 Main St, San Francisco, CA
                          created-at: '2026-05-20T18:03:11Z'
                          channel-listings:
                          - channel: airbnb
                            channel-id: '987654321'
                        relationships:
                          owner:
                            data:
                              type: users
                              id: '456'
                      meta:
                        pagination:
                          page: 1
                          pages: 1
                          count: 1
                    links:
                      first: http://example.com/articles?page%5Bsize%5D=10&page%5Bnumber%5D=1
                      last: http://example.com/articles?page%5Bsize%5D=10&page%5Bnumber%5D=9
                      prev: http://example.com/articles?page%5Bsize%5D=10&page%5Bnumber%5D=1
                      next: http://example.com/articles?page%5Bsize%5D=10&page%5Bnumber%5D=3
                    meta:
                      pagination:
                        count: 42
                        page: 2
                        pages: 5
                  summary: Listing list
          description: ''
        '401':
          description: Unauthorized - invalid or missing bearer token
        '403':
          description: Forbidden
        '429':
          description: Rate limit exceeded
        '500':
          description: Internal server error
  /api/v1/listings/{listing_id}/:
    get:
      operationId: get_listing
      description: 'Retrieve detailed information about a specific listing.


        **Required scope:** `listings:read`


        **Compound documents (sideloading):**

        Use the `include` query parameter to include related resources in a single request.

        This follows the JSON:API specification for compound documents.


        Supported includes:

        - `owner` - The user who owns the listing


        **Example:** `GET /api/v1/listings/123/?include=owner`'
      summary: Retrieve a listing by ID
      parameters:
      - in: path
        name: listing_id
        schema:
          type: integer
        required: true
      - in: query
        name: include
        schema:
          type: array
          items:
            type: string
            enum:
            - owner
        description: include query parameter to allow the client to customize which related resources should be returned.
        explode: false
      - in: query
        name: fields[listings]
        schema:
          type: array
          items:
            type: string
            enum:
            - title
            - image
            - neighborhood
            - city
            - state
            - country
            - market
            - room-type
            - bedrooms
            - bathrooms
            - base-price
            - base-price-updated-at
            - min-price
            - min-price-updated-at
            - max-price
            - min-stay
            - extra-guest-fee
            - extra-guest-threshold
            - latitude
            - longitude
            - timezone
            - currency
            - in-active-market
            - enabled
            - address
            - created-at
            - owner
            - channel-listings
            - sync-status
        description: endpoint return only specific fields in the response on a per-type basis by including a fields[TYPE] query parameter.
        explode: false
      tags:
      - Listings
      security:
      - oauth2:
        - listings:read
      - oauth2:
        - beyond:read
      - oauth2:
        - beyond:write
      - personalAccessToken: []
      responses:
        '200':
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ListingDetailResponse'
              examples:
                ListingDetail:
                  value:
                    data:
                      type: listings
                      id: '123'
                      attributes:
                        title: Sunny 2BR near the beach
                        image: https://images.example.com/listing-123.jpg
                        neighborhood: Mission District
                        city: San Francisco
                        state: CA
                        country: US
                        market: San Francisco
                        room-type: entire_home
                        bedrooms: 2
                        bathrooms: '1.50'
                        base-price: 189
                        base-price-updated-at: '2026-07-02T09:15:00Z'
                        min-price: 95
                        min-price-updated-at: '2026-07-02T09:15:00Z'
                        max-price: null
                        min-stay: 2
                        extra-guest-fee: 25
                        extra-guest-threshold: 4
                        latitude: '37.77490000'
                        longitude: '-122.41940000'
                        timezone: America/Los_Angeles
                        currency: USD
                        in-active-market: true
                        enabled: true
                        address: 123 Main St, San Francisco, CA
                        created-at: '2026-05-20T18:03:11Z'
                        channel-listings:
                        - channel: airbnb
                          channel-id: '987654321'
                        sync-status:
                          state: completed
                          last-successful-sync-at: '2026-08-09T04:12:44Z'
                      relationships:
                        owner:
                          data:
                            type: users
                            id: '456'
                  summary: Listing detail
          description: ''
        '401':
          description: Unauthorized - invalid or missing bearer token
        '403':
          description: Forbidden
        '404':
          description: Not found - resource does not exist
        '429':
          description: Rate limit exceeded
        '500':
          description: Internal server error
  /api/v1/listings/{listing_id}/activation/:
    patch:
      operationId: patch_listing_activation
      description: Enable or disable price syncing for a listing.
      summary: Update listing activation
      parameters:
      - in: path
        name: listing_id
        schema:
          type: integer
        required: true
      tags:
      - Listings
      requestBody:
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/PatchedListingActivationRequest'
            examples:
              EnablePriceSyncing:
                value:
                  data:
                    type: listing-activations
                    id: '123'
                    attributes:
                      enabled: true
                      base-price: 189
                      min-price: 95
                summary: Enable price syncing
        required: true
      security:
      - oauth2:
        - listings:write
      - personalAccessToken: []
      responses:
        '200':
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ListingActivationResponse'
          description: ''
        '304':
          description: Not modified
        '400':
          description: Validation error
        '401':
          description: Unauthorized - invalid or missing bearer token
        '403':
          description: Forbidden
        '404':
          description: Not found - resource does not exist
        '422':
          description: Unprocessable entity
        '429':
          description: Rate limit exceeded
        '500':
          description: Internal server error
  /api/v1/listings/{listing_id}/calendar/:
    get:
      operationId: list_listing_calendar
      description: 'Retrieve the pricing calendar for a specific listing.


        **Required scope:** `reservations:read`


        **Currency:** Price fields are returned in the listing''s own currency,

        the one the listings endpoint reports as `currency`. It is not the

        owner''s billing currency, which is what market insights are priced in.


        **Date range:** Use `filter[start-date]` and `filter[end-date]` query parameters

        (YYYY-MM-DD, JSON:API spec). Defaults to today through today + 365 days.


        **Sorting:** Use `sort=date` (ascending, default) or `sort=-date`.


        **Pagination:** Use `page[number]` and `page[size]` query parameters.


        **Sparse fieldsets:** Use `fields[calendar-entries]` to select specific fields.


        **Example:** `GET /api/v1/listings/123/calendar/?filter[start-date]=2026-01-01&filter[end-date]=2026-06-30&sort=date`'
      summary: Get calendar for a listing
      parameters:
      - in: path
        name: listing_id
        schema:
          type: integer
        required: true
      - name: page[number]
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page[size]
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: filter[start-date]
        schema:
          type: string
          format: date
        description: Start date (YYYY-MM-DD). Defaults to today in the listing's timezone.
      - in: query
        name: filter[end-date]
        schema:
          type: string
          format: date
        description: End date (YYYY-MM-DD). Defaults to today + 365 days.
      - in: query
        name: sort
        schema:
          type: string
          enum:
          - -date
          - date
        description: 'Sort calendar entries by date. Supported values: date, -date. Defaults to date.'
      - in: query
        name: fields[calendar-entries]
        schema:
          type: array
          items:
            type: string
            enum:
            - id
            - date
            - availability
            - price
            - price-posted
            - effective-min-price
            - effective-max-price
            - price-override-type
            - factors
        description: endpoint return only specific fields in the response on a per-type basis by including a fields[TYPE] query parameter.
        explode: false
      tags:
      - Listings
      security:
      - oauth2:
        - reservations:read
      - oauth2:
        - beyond:read
      - personalAccessToken: []
      responses:
        '200':
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/PaginatedCalendarEntryList'
              examples:
                CalendarEntries:
                  value:
                    data:
                    - data:
                      - type: calendar-entries
                        id: '2026-03-10'
                        attributes:
                          date: '2026-03-10'
                          availability: available
                          price: 101
                          price-posted: 100
                          effective-min-price: 80
                          effective-max-price: 250
                          price-override-type: null
                          factors:
                          - key: seasonality
                            order: 1
                            ratio: 0.12
                            amount: 11
                          - key: event
                            order: 2
                            ratio: 0.05
                            amount: 5
                            reason: City Marathon
                            event-impact: high
                          - key: feature_occupancy_premium
                            order: 3
                            ratio: 0.03
                            amount: 3
                            metadata:
                              listing-occupancy: 45.45
                              market-occupancy: 27.32
                      meta:
                        pagination:
                          page: 1
                          pages: 1
                          count: 1
                    links:
                      first: http://example.com/articles?page%5Bsize%5D=10&page%5Bnumber%5D=1
                      last: http://example.com/articles?page%5Bsize%5D=10&page%5Bnumber%5D=9
                      prev: http://example.com/articles?page%5Bsize%5D=10&page%5Bnumber%5D=1
                      next: http://example.com/articles?page%5Bsize%5D=10&page%5Bnumber%5D=3
                    meta:
                      pagination:
                        count: 42
                        page: 2
                        pages: 5
                  summary: Calendar entries
          description: ''
        '401':
          description: Unauthorized - invalid or missing bearer token
        '403':
          description: Forbidden
        '404':
          description: Not found - resource does not exist
        '422':
          description: Unprocessable - invalid dates or insufficient data
        '429':
          description: Rate limit exceeded
        '500':
          description: Internal server error
  /api/v1/listings/{listing_id}/change-history/:
    get:
      operationId: list_listing_changes
      description: 'List the changes made to a listing''s settings, newest first.


        **Required scope:** `listings:read`


        Covers every surface: the Beyond API, the Beyond app, the Beyond MCP

        server, and Beyond itself. Each change lists the settings written

        together, with a human-readable description of the new state; the

        previous value is not recorded. `source` and `changed-by` say where and

        by whom, as the dashboard''s history shows them.

        Narrow the window with `filter[changed-after]` / `filter[changed-before]`.'
      summary: List a listing's change history
      parameters:
      - in: path
        name: listing_id
        schema:
          type: integer
        required: true
      - in: query
        name: filter[changed-after]
        schema:
          type: string
          format: date-time
      - in: query
        name: filter[changed-before]
        schema:
          type: string
          format: date-time
      - name: page[number]
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page[size]
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: fields[listing-changes]
        schema:
          type: array
          items:
            type: string
            enum:
            - id
            - changed-at
            - source
            - changed-by
            - changes
        description: endpoint return only specific fields in the response on a per-type basis by including a fields[TYPE] query parameter.
        explode: false
      tags:
      - Listings
      security:
      - oauth2:
        - listings:read
      - personalAccessToken: []
      responses:
        '200':
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/PaginatedListingChangeList'
              examples:
                ChangeHistory:
                  value:
                    data:
                    - data:
                      - type: listing-changes
                        id: '88213'
                        attributes:
                          changed-at: '2026-09-21T14:03:11Z'
                          source: beyond-api
                          changed-by: ops@example.com
                          changes:
                          - setting: base-price
                            description: Set Base Price to 150
                          - setting: min-price
                            description: Set Min Price to 90
                      - type: listing-changes
                        id: '88160'
                        attributes:
                          changed-at: '2026-09-19T17:22:40Z'
                          source: listing-customize
                          changed-by: host@example.com
                          changes:
                          - setting: seasonal-min-stays
                            description: Set Min Stay to 3 from 2026-12-20 to 2027-01-03
                      - type: listing-changes
                        id: '88107'
                        attributes:
                          changed-at: '2026-09-18T08:40:52Z'
                          source: internal-tools
                          changed-by: support@beyondpricing.com
                          changes:
                          - setting: max-stay
                            description: Set Max Stay to 30
                      meta:
                        pagination:
                          page: 1
                          pages: 1
                          count: 3
                    links:
                      first: http://example.com/articles?page%5Bsize%5D=10&page%5Bnumber%5D=1
                      last: http://example.com/articles?page%5Bsize%5D=10&page%5Bnumber%5D=9
                      prev: http://example.com/articles?page%5Bsize%5D=10&page%5Bnumber%5D=1
                      next: http://example.com/articles?page%5Bsize%5D=10&page%5Bnumber%5D=3
                    meta:
                      pagination:
                        count: 42
                        page: 2
                        pages: 5
                  summary: Change history
          description: ''
        '400':
          description: Validation error
        '401':
          description: Unauthorized - invalid or missing bearer token
        '403':
          description: Forbidden
        '404':
          description: Not found - resource does not exist
        '429':
          description: Rate limit exceeded
        '500':
          description: Internal server error
  /api/v1/listings/{listing_id}/recommendations/:
    get:
      operationId: list_listing_recommendations
      description: 'Retrieve recommendations for a specific listing.


        **Required scope:** `listings:read`


        The listing must belong to a user owned by the authenticated OAuth2

        application. When no recommendations exist, the endpoint returns an

        empty JSON:API collection.'
      summary: List recommendations for a listing
      parameters:
      - in: path
        name: listing_id
        schema:
          type: integer
        required: true
      - name: page[number]
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page[size]
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: fields[recommendations]
        schema:
          type: array
          items:
            type: string
            enum:
            - listing-id
            - listing-title
            - status
            - approved-at
            - rejected-at
            - expired-at
            - suggested-base-price
            - suggested-min-price
            - suggested-seasonal-min-price-pct
            - initial-base-price
            - initial-min-price
            - recommendations
            - category
            - created-at
        description: endpoint return only specific fields in the response on a per-type basis by including a fields[TYPE] query parameter.
        explode: false
      tags:
      - Listings
      security:
      - oauth2:
        - listings:read
      - personalAccessToken: []
      responses:
        '200':
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/PaginatedRecommendationList'
              examples:
                RecommendationsList:
                  value:
                    data:
                    - data:
                      - type: recommendations
                        id: '9001'
                        attributes:
                          listing-id: 123
                          listing-title: Sunny 2BR near the beach
                          status: suggestion_completed
                          approved-at: null
                          rejected-at: null
                          expired-at: null
                          suggested-base-price: 175
                          suggested-min-price: 120
                          suggested-seasonal-min-price-pct: -10.5
                          initial-base-price: 150
                          initial-min-price: 100
                          recommendations: Raise the base price before the next weekend.
                          category: base_price
                          created-at: '2026-03-25T12:00:00Z'
                      meta:
                        pagination:
                          page: 1
                          pages: 1
                          count: 1
                    links:
                      first: http://example.com/articles?page%5Bsize%5D=10&page%5Bnumber%5D=1
                      last: http://example.com/articles?page%5Bsize%5D=10&page%5Bnumber%5D=9
                      prev: http://example.com/articles?page%5Bsize%5D=10&page%5Bnumber%5D=1
                      next: http://example.com/articles?page%5Bsize%5D=10&page%5Bnumber%5D=3
                    meta:
                      pagination:
                        count: 42
                        page: 2
                        pages: 5
                  summary: Recommendations list
          description: ''
        '401':
          description: Unauthorized - invalid or missing bearer token
        '403':
          description: Forbidden
        '404':
          description: Not found - resource does not exist
        '429':
          description: Rate limit exceeded
        '500':
          description: Internal server error
  /api/v1/listings/{listing_id}/refresh/:
    post:
      operationId: refresh_listing_reservations
      description: 'Queue an asynchronous full refresh for the specified listing.


        This endpoint enqueues a `sync_listing` job (listing details and availability) followed by a `sync_reservations` job for the listing''s primary channel listing, then recomputes the automatic base price. It returns immediately.


        Use the optional `sync-priority` query parameter to say how soon the refresh starts: `high` (the default) starts it as soon as Beyond can, `normal` can take longer to start when Beyond is busy. Send `normal` when you refresh many listings at once and none of them is urgent.


        ## Response Codes

        - **202**: Listing refresh accepted and queued

        - **400**: Validation error - invalid query parameter

        - **401**: Unauthorized - invalid or missing OAuth2 token

        - **403**: Forbidden - insufficient scope

        - **404**: Not found - listing not found or has no active channel listing'
      summary: Refresh a listing (details and reservations)
      parameters:
      - in: path
        name: listing_id
        schema:
          type: integer
        required: true
      - in: query
        name: sync-priority
        schema:
          type: string
          enum:
          - high
          - normal
          default: high
        description: How soon the listing refresh starts. `high` (the default) starts it as soon as Beyond can. `normal` can take longer to start when Beyond is busy, which suits refreshing many listings at once. Any other value is a `400`.
      tags:
      - Listings
      security:
      - oauth2:
        - listings:write
      - personalAccessToken: []
      responses:
        '202':
          description: Listing refresh accepted
        '400':
          description: Validation error
        '401':
          description: Unauthorized - invalid or missing bearer token
        '403':
          description: Forbidden
        '404':
          description: Not found - resource does not exist
        '429':
          description: Rate limit exceeded
        '500':
          description: Internal server error
components:
  schemas:
    ListingChannelListing:
      type: object
      description: Serializer for channel listings embedded in listing responses.
      properties:
        channel:
          type: string
          description: Channel identifier for the linked channel listing
        channel-id:
          type: string
          description: Listing identifier on the channel side
      required:
      - channel
      - channel-id
    CalendarEntry:
      type: object
      required:
      - type
      - id
      additionalProperties: false
      properties:
        type:
          allOf:
          - $ref: '#/components/schemas/CalendarEntryResourceTypeEnum'
          description: The [type](https://jsonapi.org/format/#document-resource-object-identification) member is used to describe resource objects that share common attributes and relationships.
        id:
          type: string
          description: Unique identifier for the calendar entry (the date string)
        attributes:
          type: object
          properties:
            date:
              type: string
              format: date
              description: Calendar date
            availability:
              type: string
              description: Availability status (e.g., 'available', 'booked', 'blocked')
            price:
              type: integer
              description: Final price as an integer in whole currency units (never cents), in the listing's currency
            price-posted:
              type:
              - integer
              - 'null'
              description: Last price posted to the channel, in the same units as `price`
            effective-min-price:
              type: integer
