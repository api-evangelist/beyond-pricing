aid: beyond-pricing
name: Beyond Pricing
description: >-
  Beyond (formerly Beyond Pricing) is a revenue management platform for
  short-term and vacation rental businesses. Its dynamic pricing engine
  automatically adjusts nightly rates against real-time market demand across
  Airbnb, Vrbo, Booking.com and dozens of property management systems, and the
  platform adds market insights, direct-booking sites (Signal), payment
  processing (Tally), an AI pricing assistant (Neyoba) and owner reporting. The
  Beyond Partners API is a Bearer-protected, JSON:API (v1.1) REST API for
  third-party integrations: partners authenticate with OAuth2 client
  credentials on a confidential client (optionally narrowed to a single user or
  credential), while individual users automate their own accounts with
  personal access tokens (bpat_...). The API exposes listings, pricing
  calendars, listing customizations, competitive sets, recommendations, managed
  channel accounts, users, and market insights, with signed Standard Webhooks
  for real-time events, transparent rate-limit headers, URL-path versioning and
  a published deprecation policy.
