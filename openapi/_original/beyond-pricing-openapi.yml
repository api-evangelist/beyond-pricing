          basis by including a fields[TYPE] query parameter.
        explode: false
      tags:
      - Webhooks
      security:
      - oauth2:
        - webhooks:read
      - personalAccessToken: []
      responses:
        '200':
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/WebhookConfigurationResponse'
              examples:
                SubscribedToEveryEventType:
                  value:
                    data:
                      type: webhook-configurations
                      id: your-client-id
                      attributes:
                        webhook-url: https://example.com/beyond/webhooks
                        subscribed-events:
                        - '*'
                        available-events:
                        - account.created
                        - account.refreshed
                        - listing.base_price_changed
                        - listing.created
