  /api/v1/webhook-events/{msg_id}/:
    get:
      operationId: get_webhook_event
      description: |-
        Retrieve one delivered webhook event, including the body sent.

        **Required scope:** `webhooks:read`

        The event is returned only when it belongs to your token's scope; an id
        for another partner (or user) reads as 404.
      summary: Retrieve a delivered webhook event by id
      parameters:
      - in: path
        name: msg_id
        schema:
          type: string
        required: true
      - in: query
        name: fields[webhook-events]
        schema:
          type: array
          items:
            type: string
            enum:
            - id
            - event-type
            - status
            - content-type
            - attempts
            - last-status-code
            - last-error
            - created-at
            - delivered-at
            - failed-at
            - url
            - body
        description: endpoint return only specific fields in the response on a per-type
          basis by including a fields[TYPE] query parameter.
        explode: false
      tags:
      - Webhooks
      security:
      - oauth2:
        - webhooks:read
      - personalAccessToken: []
      responses:
        '200':
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/WebhookEventDetailResponse'
              examples:
                DeliveredEventWithBody:
                  value:
                    data:
                      type: webhook-events
                      id: msg_2h9pXbFqR7Jk
                      attributes:
                        event-type: listing.refreshed
                        status: delivered
                        content-type: application/vnd.api+json
                        attempts: 1
                        last-status-code: 200
                        last-error: null
                        created-at: '2026-08-01T10:15:00Z'
                        delivered-at: '2026-08-01T10:15:02Z'
                        failed-at: null
                        url: https://partner.example.com/webhooks/beyond
                        body:
                          data:
                            type: listing-refreshed-events
                            id: msg_2h9pXbFqR7Jk
                            attributes:
                              '...': the document your endpoint received
                  summary: Delivered event with body
          description: ''
        '401':
          description: Unauthorized - invalid or missing bearer token
        '403':
          description: Forbidden
        '404':
          description: Not found - resource does not exist
        '429':
          description: Rate limit exceeded
        '500':
          description: Internal server error
  /o/token/:
    post:
      operationId: create_token
      summary: Request an OAuth2 access token
      description: |-
        Exchange client credentials for an access token.

        When called without extra subject fields, this endpoint issues an **application-level OAuth2 token**.

        Include `user_id` to obtain a **user-scoped OAuth2 token** that restricts access to a single user's resources. Include `credential_id` to further bind that token to one login credential within the user.

        Personal access tokens are issued separately and are not minted through `/o/token/`. Paste a `bpat_...` token directly into the **Authorize** dialog (lock icon) when you want to authenticate with a PAT.

        After obtaining an OAuth2 token here, copy it and paste it into the **Authorize** dialog to authenticate subsequent requests.
      tags:
      - OAuth2
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - grant_type
              - client_id
              - client_secret
              properties:
                grant_type:
                  type: string
                  enum:
                  - client_credentials
                  description: OAuth2 grant type.
                client_id:
                  type: string
                  description: Application client ID.
                client_secret:
                  type: string
                  description: Application client secret.
                scope:
                  type: string
                  description: 'Space-separated list of scopes. Available: `listings:read`,
                    `listings:write`, `reservations:read`, `accounts:read`, `user:read`,
                    `user:write`, `insights:read`, `compsets:read`, `neyoba:ask`,
                    `beyond:read`, `beyond:write`, `beyond:skills`, `beyond:usage`,
                    `webhooks:read`, `webhooks:write`.'
                user_id:
                  type: integer
                  description: Bind the token to this user's resources (user-scoped
                    token). Required when the application enforces user-scoped tokens.
                credential_id:
                  type: integer
                  description: Optional login credential within the bound user. When
                    omitted for a user-scoped token, the user's primary credential
                    is used.
      responses:
        '200':
          description: Token issued successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                    description: Bearer token for API requests.
                  token_type:
                    type: string
                    example: Bearer
                  expires_in:
                    type: integer
                    example: 3600
                    description: Token lifetime in seconds.
                  scope:
                    type: string
                    description: Granted scopes (space-separated).
                  user_id:
                    type: string
                    description: Present only for user-scoped tokens. The ID of the
                      bound user.
                  credential_id:
                    type: string
                    description: Present when the token is bound to a specific user
                      credential.
        '400':
          description: Invalid request (missing or invalid parameters).
        '401':
          description: Invalid client credentials.
components:
