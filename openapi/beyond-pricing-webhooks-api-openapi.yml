openapi: 3.2.0
info:
  title: Beyond Webhooks API
  version: 2.0.0
  description: Bearer-protected API for third-party integrations. Supports OAuth2 client credentials and personal access tokens. Follows JSON:API specification.
tags:
- name: Webhooks
paths:
  /api/v1/webhook-configuration/:
    get:
      operationId: get_webhook_configuration
      description: 'Retrieve where your webhooks are delivered and which events you receive.


        **Required scope:** `webhooks:read`


        `subscribed-events` is returned exactly as stored: `["*"]` means you are

        enrolled in every event type, including ones added in future, rather

        than pinned to the list you see in `available-events` today.'
      summary: Retrieve your webhook configuration
      parameters:
      - in: query
        name: fields[webhook-configurations]
        schema:
          type: array
          items:
            type: string
            enum:
            - id
            - webhook-url
            - subscribed-events
            - available-events
        description: endpoint return only specific fields in the response on a per-type basis by including a fields[TYPE] query parameter.
        explode: false
      tags:
      - Webhooks
      security:
      - oauth2:
        - webhooks:read
      - personalAccessToken: []
      responses:
        '200':
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/WebhookConfigurationResponse'
              examples:
                SubscribedToEveryEventType:
                  value:
                    data:
                      type: webhook-configurations
                      id: your-client-id
                      attributes:
                        webhook-url: https://example.com/beyond/webhooks
                        subscribed-events:
                        - '*'
                        available-events:
                        - account.created
                        - account.refreshed
                        - listing.base_price_changed
                        - listing.created
                        - listing.in_active_market_changed
                        - listing.refreshed
                        - webhook.ping
                  summary: Subscribed to every event type
          description: ''
        '401':
          description: Unauthorized - invalid or missing bearer token
        '403':
          description: Forbidden
        '429':
          description: Rate limit exceeded
        '500':
          description: Internal server error
    patch:
      operationId: patch_webhook_configuration
      description: 'Change your webhook destination, your event selection, or both.


        **Required scope:** `webhooks:write` (application-level tokens only)


        Each attribute you send replaces the stored value wholesale —

        `subscribed-events` is not merged, so send the full list you want. Omit

        an attribute to leave it untouched.


        `data.id` is your own client id, the same value `GET` returns. JSON:API

        requires it on every update: omitting it returns `400`, and another

        application''s id returns `409`.


        A new `webhook-url` takes effect immediately; Beyond does not probe it

        first, so verify it is live before switching. Send an empty string to

        stop delivery while keeping your event selection.'
      summary: Update your webhook configuration
      tags:
      - Webhooks
      requestBody:
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/PatchedWebhookConfigurationRequest'
            examples:
              PinToSpecificEventTypes:
                value:
                  data:
                    type: webhook-configurations
                    id: your-client-id
                    attributes:
                      subscribed-events:
                      - listing.created
                      - listing.base_price_changed
                summary: Receive only the event types you list
              ChangeTheDestinationURL:
                value:
                  data:
                    type: webhook-configurations
                    id: your-client-id
                    attributes:
                      webhook-url: https://example.com/beyond/webhooks-v2
                summary: Move deliveries to a new endpoint
        required: true
      security:
      - oauth2:
        - webhooks:write
      - personalAccessToken: []
      responses:
        '200':
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/WebhookConfigurationResponse'
              examples:
                UpdatedConfiguration:
                  value:
                    data:
                      type: webhook-configurations
                      id: your-client-id
                      attributes:
                        webhook-url: https://example.com/beyond/webhooks
                        subscribed-events:
                        - listing.created
                        - listing.base_price_changed
                        available-events:
                        - account.created
                        - account.refreshed
                        - listing.base_price_changed
                        - listing.created
                        - listing.in_active_market_changed
                        - listing.refreshed
                        - webhook.ping
                  summary: Updated configuration
          description: ''
        '400':
          description: Validation error
        '401':
          description: Unauthorized - invalid or missing bearer token
        '403':
          description: Forbidden
        '429':
          description: Rate limit exceeded
        '500':
          description: Internal server error
  /api/v1/webhook-events/:
    get:
      operationId: list_webhook_events
      description: 'List the webhook events delivered to your partner application.


        **Required scope:** `webhooks:read`


        Application-level tokens see every event sent to the app''s webhook

        endpoint; user-scoped tokens see only their own user''s events. Filter

        with `filter[event-type]`, `filter[status]`, and the

        `filter[created-after]`/`filter[created-before]` time window. Pass

        `include-body=true` to inline each event''s body so you can reconcile and

        reprocess a range without a follow-up request per event.'
      summary: List delivered webhook events
      parameters:
      - name: page[number]
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page[size]
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: filter[event-type]
        schema:
          type: string
        description: Only return events of this type.
      - in: query
        name: filter[status]
        schema:
          type: string
          enum:
          - delivered
          - exhausted
          - failed
          - pending
        description: Only return events in this delivery status (pending, delivered, failed, exhausted).
      - in: query
        name: filter[created-after]
        schema:
          type: string
          format: date-time
        description: Only return events created at or after this ISO 8601 timestamp (e.g. 2026-07-13T19:00:00Z).
      - in: query
        name: filter[created-before]
        schema:
          type: string
          format: date-time
        description: Only return events created at or before this ISO 8601 timestamp (e.g. 2026-07-13T20:00:00Z).
      - in: query
        name: include-body
        schema:
          type: boolean
        description: Include each event's full body (nested JSON) in the list. Off by default to keep the list light; enable it to reconcile and reprocess a range of events in a single call.
      - in: query
        name: fields[webhook-events]
        schema:
          type: array
          items:
            type: string
            enum:
            - id
            - event-type
            - status
            - content-type
            - attempts
            - last-status-code
            - last-error
            - created-at
            - delivered-at
            - failed-at
        description: endpoint return only specific fields in the response on a per-type basis by including a fields[TYPE] query parameter.
        explode: false
      tags:
      - Webhooks
      security:
      - oauth2:
        - webhooks:read
      - personalAccessToken: []
      responses:
        '200':
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/PaginatedWebhookEventList'
              examples:
                DeliveredEvents:
                  value:
                    data:
                    - data:
                      - type: webhook-events
                        id: msg_2h9pXbFqR7Jk
                        attributes:
                          event-type: listing.refreshed
                          status: delivered
                          content-type: application/vnd.api+json
                          attempts: 1
                          last-status-code: 200
                          last-error: null
                          created-at: '2026-08-01T10:15:00Z'
                          delivered-at: '2026-08-01T10:15:02Z'
                          failed-at: null
                      meta:
                        pagination:
                          page: 1
                          pages: 1
                          count: 1
                    links:
                      first: http://example.com/articles?page%5Bsize%5D=10&page%5Bnumber%5D=1
                      last: http://example.com/articles?page%5Bsize%5D=10&page%5Bnumber%5D=9
                      prev: http://example.com/articles?page%5Bsize%5D=10&page%5Bnumber%5D=1
                      next: http://example.com/articles?page%5Bsize%5D=10&page%5Bnumber%5D=3
                    meta:
                      pagination:
                        count: 42
                        page: 2
                        pages: 5
                  summary: Delivered events
          description: ''
        '400':
          description: Validation error
        '401':
          description: Unauthorized - invalid or missing bearer token
        '403':
          description: Forbidden
        '429':
          description: Rate limit exceeded
        '500':
          description: Internal server error
  /api/v1/webhook-events/{msg_id}/:
    get:
      operationId: get_webhook_event
      description: 'Retrieve one delivered webhook event, including the body sent.


        **Required scope:** `webhooks:read`


        The event is returned only when it belongs to your token''s scope; an id

        for another partner (or user) reads as 404.'
      summary: Retrieve a delivered webhook event by id
      parameters:
      - in: path
        name: msg_id
        schema:
          type: string
        required: true
      - in: query
        name: fields[webhook-events]
        schema:
          type: array
          items:
            type: string
            enum:
            - id
            - event-type
            - status
            - content-type
            - attempts
            - last-status-code
            - last-error
            - created-at
            - delivered-at
            - failed-at
            - url
            - body
        description: endpoint return only specific fields in the response on a per-type basis by including a fields[TYPE] query parameter.
        explode: false
      tags:
      - Webhooks
      security:
      - oauth2:
        - webhooks:read
      - personalAccessToken: []
      responses:
        '200':
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/WebhookEventDetailResponse'
              examples:
                DeliveredEventWithBody:
                  value:
                    data:
                      type: webhook-events
                      id: msg_2h9pXbFqR7Jk
                      attributes:
                        event-type: listing.refreshed
                        status: delivered
                        content-type: application/vnd.api+json
                        attempts: 1
                        last-status-code: 200
                        last-error: null
                        created-at: '2026-08-01T10:15:00Z'
                        delivered-at: '2026-08-01T10:15:02Z'
                        failed-at: null
                        url: https://partner.example.com/webhooks/beyond
                        body:
                          data:
                            type: listing-refreshed-events
                            id: msg_2h9pXbFqR7Jk
                            attributes:
                              '...': the document your endpoint received
                  summary: Delivered event with body
          description: ''
        '401':
          description: Unauthorized - invalid or missing bearer token
        '403':
          description: Forbidden
        '404':
          description: Not found - resource does not exist
        '429':
          description: Rate limit exceeded
        '500':
          description: Internal server error
webhooks:
  accountCreated:
    post:
      description: 'Sent when the background listing sync that follows `POST /users/{user_id}/accounts/` reaches a terminal state — every listing on the account has been pulled from the channel and created in Beyond, or the sync failed.


        `succeeded` means the listings *exist*, not that they are priced. A listing becomes fully set up (base price computed) later, and each one emits its own `listing.created` event at that point.


        The event fires the same way whether the account was newly created or an existing, previously deleted account was revived; in the revive case the restored listings are counted in `nb-listings-synced`.


        Credential problems (invalid credentials, 2FA, channel outage) are reported synchronously on the `POST` response and emit no event.


        Verify the signature before parsing the body. See the partner webhooks guide for the verification recipe.'
      summary: Managed account listing sync completed
      tags:
      - Webhooks
      requestBody:
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/AccountCreatedEvent'
        required: true
      responses:
        '200':
          description: Delivery acknowledged (any 2xx).
        '410':
          description: Endpoint permanently gone. Partners should respond 410 to disable redelivery; future iterations may auto-disable endpoints in this case.
  accountRefreshed:
    post:
      description: 'Sent when the background listing sync started by `POST /users/{user_id}/accounts/{account_id}/refresh/` reaches a terminal state — every listing the refresh considered has been re-pulled from the channel, or the sync failed.


        The event covers **listings only**. Reservations are refreshed by independent background jobs that outlive this event, so they are still in flight when it is delivered.


        Listings synced within the last `recent-sync-threshold-minutes` are skipped and are not counted in `nb-listings-synced`. A refresh that skips every listing is still `succeeded`, with `nb-listings-synced` of 0.


        Verify the signature before parsing the body. See the partner webhooks guide for the verification recipe.'
      summary: Managed account refresh completed
      tags:
      - Webhooks
      requestBody:
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/AccountRefreshedEvent'
        required: true
      responses:
        '200':
          description: Delivery acknowledged (any 2xx).
        '410':
          description: Endpoint permanently gone. Partners should respond 410 to disable redelivery; future iterations may auto-disable endpoints in this case.
  listingBasePriceChanged:
    post:
      description: 'Sent whenever a listing''s effective base price changes — through the Beyond API or any other Beyond surface. This covers the user-set base price changing, and — while no user base price is set — the starting base price Beyond''s algorithm computes from the listing''s characteristics changing from one value to another. The first-ever price (null → value) is delivered as `listing.created` instead, not here.


        `enabled` reports whether the listing has pricing enabled: use it to tell a live price change (`enabled: true`) from a speculative one (`enabled: false`, e.g. a computed starting price on a not-yet-enabled listing).


        `change-source` reports what moved the price: `user` for a change made by an authenticated actor (Beyond API, the Beyond app, or an admin), or `system` for one made by an automatic process (Beyond''s algorithm computing a starting price, a scheduled auto-approved booking review, a background job). A change to the computed starting price is always `system`.


        `changed-by` names the individual behind a `user` change by email. It is null when no individual is responsible: every `system` change, and any change made by a machine — an app-level (`client_credentials`) Partners API token acts for the account as a whole, so it names no person. Changes made by Beyond staff on your behalf report `support@beyondpricing.com` rather than an internal address.


        The same `msg_id` is reused across delivery retries, so partners can dedupe on the `webhook-id` header. `old-base-price` is null the first time a base price is set. Verify the signature before parsing the body. See the partner webhooks guide for the verification recipe.'
      summary: Listing base price changed
      tags:
      - Webhooks
      requestBody:
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/ListingBasePriceChangedEvent'
        required: true
      responses:
        '200':
          description: Delivery acknowledged (any 2xx).
        '410':
          description: Endpoint permanently gone. Partners should respond 410 to disable redelivery; future iterations may auto-disable endpoints in this case.
  listingCreated:
    post:
      description: 'Sent when a new listing owned by one of your users is fully set up — after Beyond has computed its initial base price — and when an attempt to set one up fails. Use it to learn about new listings, and about listings that need attention before they can be created, without polling. The same `msg_id` is reused across delivery retries, so partners can dedupe on the `webhook-id` header.


        With `status=''succeeded''` the event fires when the listing''s base price is first computed, and again — carrying `restored=true` — if the listing is ever removed and later comes back, so treat it as an upsert rather than an insert. With `status=''failed''` it fires on every failing sync attempt — a listing whose channel setup stays broken repeats the event on each re-sync — carrying a human-readable `error`; the `listing` relationship and the listing attributes are null or omitted when the listing does not exist yet. Verify the signature before parsing the body. See the partner webhooks guide for the verification recipe.'
      summary: Listing created
      tags:
      - Webhooks
      requestBody:
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/ListingCreatedEvent'
        required: true
      responses:
        '200':
          description: Delivery acknowledged (any 2xx).
        '410':
          description: Endpoint permanently gone. Partners should respond 410 to disable redelivery; future iterations may auto-disable endpoints in this case.
  listingInActiveMarketChanged:
    post:
      description: 'Sent when a listing''s `in-active-market` attribute — the one the listings endpoint serves — changes. `in-active-market: true` guarantees the listing''s calendar endpoint works and automated price refresh is on; while false the calendar may return 400 ("not yet clustered") and price refresh is off. Subscribe to it to learn when a listing you already received leaves or re-enters that ready state, without polling.


        It also fires once at creation for a listing created outside any active market (Beyond found no pricing cluster covering its location). Such a listing gets no `listing.created` event, so this is the first notification you receive about it — treat an unknown listing id as new rather than as an error.


        Otherwise the transition is rare: it happens when Beyond removes or re-assigns the listing''s pricing cluster, or activates/deactivates the listing''s market. It fires once per flip, in either direction — `in-active-market` carries the new value. A market-wide change (e.g. Beyond activating a market) reaches each listing on its next daily sync, so expect one event per affected listing spread over about a day. There is no failure variant. The same `msg_id` is reused across delivery retries, so partners can dedupe on the `webhook-id` header. Verify the signature before parsing the body. See the partner webhooks guide for the verification recipe.'
      summary: Listing in-active-market changed
      tags:
      - Webhooks
      requestBody:
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/ListingInActiveMarketChangedEvent'
        required: true
      responses:
        '200':
          description: Delivery acknowledged (any 2xx).
        '410':
          description: Endpoint permanently gone. Partners should respond 410 to disable redelivery; future iterations may auto-disable endpoints in this case.
  listingRefreshed:
    post:
      description: 'Sent when a partner-triggered listing reservations refresh chain terminates — either both `sync_reservations` and `compute_abp_c` succeed, or any step fails. The same `msg_id` is reused across delivery retries, so partners can dedupe on the `webhook-id` header.


        Verify the signature before parsing the body. See the partner webhooks guide for the verification recipe.'
      summary: Reservations refresh completed
      tags:
      - Webhooks
      requestBody:
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/ListingRefreshedEvent'
        required: true
      responses:
        '200':
          description: Delivery acknowledged (any 2xx).
        '410':
          description: Endpoint permanently gone. Partners should respond 410 to disable redelivery; future iterations may auto-disable endpoints in this case.
  webhookPing:
    post:
      description: 'Sent when a webhook URL is saved from the Beyond dashboard and whenever a test ping is requested there. It carries no domain change: answer any `2xx` and discard the body. The ping is signed like every other delivery, so a receiver that enforces signatures from day one passes verification.


        A ping is not gated on your event selection: it is sent even when `webhook.ping` is not in `subscribed-events`, because its purpose is to confirm the endpoint before any real event is delivered. Redirects are not followed and a non-`2xx` answer means the URL is not saved.


        Verify the signature before parsing the body. See the partner webhooks guide for the verification recipe.'
      summary: Webhook endpoint verification ping
      tags:
      - Webhooks
      requestBody:
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/WebhookPingEvent'
        required: true
      responses:
        '200':
          description: Delivery acknowledged (any 2xx).
        '410':
          description: Endpoint permanently gone. Partners should respond 410 to disable redelivery; future iterations may auto-disable endpoints in this case.
components:
  schemas:
    _RelationshipData:
      type: object
      description: JSON:API ``relationships.<name>.data`` body — ``{type, id}``.
      properties:
        type:
          type: string
          description: JSON:API resource type
        id:
          type: string
          description: Resource identifier
      required:
      - id
      - type
    WebhookPingEventData:
      type: object
      description: 'Dasherizes field names on output and un-dasherizes on input.


        Apply to nested (non-resource) serializers so their keys match

        the top-level JSON:API dasherized format. Top-level resource

        serializers must NOT use this mixin (the renderer handles them).'
      properties:
        type:
          type: string
          description: JSON:API resource type for this event
        id:
          type: string
          description: ULID event identifier (msg_<base32>), same as the webhook-id header. Stable across delivery retries; dedupe on it.
        attributes:
          $ref: '#/components/schemas/WebhookPingEventAttributes'
        relationships:
          $ref: '#/components/schemas/WebhookPingEventRelationships'
      required:
      - attributes
      - id
      - relationships
      - type
    WebhookConfiguration:
      type: object
      required:
      - type
      - id
      additionalProperties: false
      properties:
        type:
          allOf:
          - $ref: '#/components/schemas/WebhookConfigurationResourceTypeEnum'
          description: The [type](https://jsonapi.org/format/#document-resource-object-identification) member is used to describe resource objects that share common attributes and relationships.
        id:
          type: string
          description: Your application's client id.
        attributes:
          type: object
          properties:
            webhook-url:
              type:
              - string
              - 'null'
              format: uri
              description: HTTPS URL that receives your webhook deliveries. Must be publicly reachable — loopback, link-local, and private addresses are rejected. Set it to an empty string to stop delivery without losing your event selection. A new URL takes effect immediately; there is no verification step, and deliveries already in flight may still land on the previous URL.
            subscribed-events:
              type: array
              items:
                type: string
              description: Event types delivered to your endpoint. The default is `["*"]`, which subscribes to every event type — including ones Beyond adds in future. Send `["*"]` to keep that; send an explicit list to pin yourself to exactly those types and receive nothing new without changing this setting. An empty list disables every event.
            available-events:
              type: array
              items:
                type: string
              readOnly: true
              description: Every event type you may subscribe to.
    ListingInActiveMarketChangedEvent:
      type: object
      properties:
        meta:
          $ref: '#/components/schemas/_EventMeta'
        data:
          $ref: '#/components/schemas/ListingInActiveMarketChangedEventData'
      required:
      - data
      - meta
    WebhookPingEvent:
      type: object
      properties:
        meta:
          $ref: '#/components/schemas/_EventMeta'
        data:
          $ref: '#/components/schemas/WebhookPingEventData'
      required:
      - data
      - meta
    ListingInActiveMarketChangedEventRelationships:
      type: object
      description: 'Dasherizes field names on output and un-dasherizes on input.


        Apply to nested (non-resource) serializers so their keys match

        the top-level JSON:API dasherized format. Top-level resource

        serializers must NOT use this mixin (the renderer handles them).'
      properties:
        listing:
          $ref: '#/components/schemas/_Relationship'
        user:
          $ref: '#/components/schemas/_Relationship'
        account:
          $ref: '#/components/schemas/_Relationship'
      required:
      - listing
      - user
    WebhookEventDetail:
      type: object
      required:
      - type
      - id
      additionalProperties: false
      properties:
        type:
          allOf:
          - $ref: '#/components/schemas/WebhookEventResourceTypeEnum'
          description: The [type](https://jsonapi.org/format/#document-resource-object-identification) member is used to describe resource objects that share common attributes and relationships.
        id:
          type: string
          description: Stable delivery id (the webhook-id partners dedupe on).
        attributes:
          type: object
          properties:
            event-type:
              type: string
              description: The event that was delivered.
            status:
              type: string
              description: 'Delivery status: pending, delivered, failed, or exhausted.'
            content-type:
              type: string
              description: Content-Type of the delivery.
            attempts:
              type: integer
              description: Number of delivery attempts made.
            last-status-code:
              type:
              - integer
              - 'null'
              description: HTTP status of the last delivery attempt.
            last-error:
              type:
              - string
              - 'null'
              description: Error from the last failed attempt, if any.
            created-at:
              type: string
              description: When the event was accepted.
            delivered-at:
              type:
              - string
              - 'null'
              description: When the event was delivered (2xx), if it was.
            failed-at:
              type:
              - string
              - 'null'
              description: When the event reached a terminal failure, if it did.
            url:
              type: string
              description: The endpoint the event was delivered to.
            body:
              type: object
              additionalProperties: {}
              description: The document that was delivered, as a nested JSON object partners can traverse directly.
              readOnly: true
          required:
          - event-type
          - status
          - content-type
          - attempts
          - last-status-code
          - last-error
          - created-at
          - delivered-at
          - failed-at
          - url
    AccountCreatedEventRelationships:
      type: object
      description: 'Dasherizes field names on output and un-dasherizes on input.


        Apply to nested (non-resource) serializers so their keys match

        the top-level JSON:API dasherized format. Top-level resource

        serializers must NOT use this mixin (the renderer handles them).'
      properties:
        user:
          $ref: '#/components/schemas/_Relationship'
        account:
          $ref: '#/components/schemas/_Relationship'
      required:
      - account
      - user
    ListingCreatedEventRelationships:
      type: object
      description: 'Dasherizes field names on output and un-dasherizes on input.


        Apply to nested (non-resource) serializers so their keys match

        the top-level JSON:API dasherized format. Top-level resource

        serializers must NOT use this mixin (the renderer handles them).'
      properties:
        listing:
          $ref: '#/components/schemas/_Relationship'
        user:
          $ref: '#/components/schemas/_Relationship'
        account:
          $ref: '#/components/schemas/_Relationship'
      required:
      - user
    WebhookConfigurationResourceTypeEnum:
      type: string
