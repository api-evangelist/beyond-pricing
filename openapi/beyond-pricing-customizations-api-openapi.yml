        start-date:
          type: string
          format: date
          description: First date the override applies.
        end-date:
          type: string
          format: date
          description: Last date the override applies.
        days-of-week:
          type: array
          items:
            $ref: '#/components/schemas/WeekdayEnum'
          description: Restrict the override to these weekdays within the date range. Omit to apply it to every date in the range.
        price:
          type:
          - number
          - 'null'
          format: double
          minimum: 1
          description: Fixed nightly price for the dates, in the listing's currency. Beyond stops repricing these dates. May be below the listing's minimum price. Mutually exclusive with `percentage-adjustment`.
        percentage-adjustment:
          type:
          - integer
          - 'null'
          maximum: 1000
          minimum: -100
          description: Percentage applied to Beyond's modeled price, where `10` means +10% and `-10` means -10%. The price keeps fluctuating with the model. Mutually exclusive with `price`.
      required:
      - end-date
      - start-date
