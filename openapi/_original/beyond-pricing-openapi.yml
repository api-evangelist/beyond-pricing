    patch:
      operationId: patch_webhook_configuration
      description: |-
        Change your webhook destination, your event selection, or both.

        **Required scope:** `webhooks:write` (application-level tokens only)

        Each attribute you send replaces the stored value wholesale —
        `subscribed-events` is not merged, so send the full list you want. Omit
        an attribute to leave it untouched.

        `data.id` is your own client id, the same value `GET` returns. JSON:API
        requires it on every update: omitting it returns `400`, and another
        application's id returns `409`.

        A new `webhook-url` takes effect immediately; Beyond does not probe it
        first, so verify it is live before switching. Send an empty string to
        stop delivery while keeping your event selection.
      summary: Update your webhook configuration
      tags:
      - Webhooks
      requestBody:
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/PatchedWebhookConfigurationRequest'
            examples:
              PinToSpecificEventTypes:
                value:
                  data:
                    type: webhook-configurations
                    id: your-client-id
                    attributes:
                      subscribed-events:
                      - listing.created
                      - listing.base_price_changed
                summary: Receive only the event types you list
              ChangeTheDestinationURL:
                value:
                  data:
                    type: webhook-configurations
                    id: your-client-id
                    attributes:
                      webhook-url: https://example.com/beyond/webhooks-v2
                summary: Move deliveries to a new endpoint
        required: true
      security:
      - oauth2:
        - webhooks:write
      - personalAccessToken: []
      responses:
        '200':
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/WebhookConfigurationResponse'
              examples:
                UpdatedConfiguration:
                  value:
                    data:
                      type: webhook-configurations
                      id: your-client-id
