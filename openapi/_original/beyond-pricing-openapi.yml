openapi: 3.1.1
info:
  title: Beyond API
  version: 2.0.0
  description: Bearer-protected API for third-party integrations. Supports OAuth2
    client credentials and personal access tokens. Follows JSON:API specification.
paths:
  /api/v1/compsets/:
    get:
      operationId: list_compsets
      description: |-
        List the comp sets visible to the authenticated client.

        **Required scope:** `compsets:read`

        **Pagination:** `page[number]` and `page[size]`.

        **Filtering:** `filter[owner]=<user_id>`, `filter[listing]=<id>`,
        `filter[kind]=custom|connected`. `filter[owner]` is only meaningful for
        full-access partner tokens; user-scoped tokens already see one user.

        **Sorting:** `sort=created-at` (default `-created-at`) or `sort=title`;
        prefix with `-` for descending.

        **Compound documents (sideloading):** Use the `include` query parameter
        to embed related resources (JSON:API compound documents). Supported:
        - `owner` - the user who owns the comp set
        - `listing` - the Beyond listing the comp set is anchored to (`null` for
          `custom` comp sets)

        **Example:** `GET /api/v1/compsets/?include=owner,listing`

        Each entry is a lightweight summary (counts, title, `kind`, timestamps).
        Fetch `GET /compsets/{id}/` for the full enriched comp set.
      summary: List comp sets
      parameters:
      - name: sort
        required: false
        in: query
        description: '[list of fields to sort by](https://jsonapi.org/format/#fetching-sorting)'
        schema:
          type: array
          items:
            type: string
            enum:
            - created-at
            - -created-at
            - title
            - -title
        explode: false
      - in: query
        name: filter[owner]
        schema:
          type: number
      - in: query
        name: filter[listing]
        schema:
          type: number
      - in: query
        name: filter[kind]
        schema:
          type: string
          enum:
          - connected
          - custom
        description: |-
          * `custom` - Custom
          * `connected` - Connected
      - name: page[number]
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page[size]
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: include
        schema:
          type: array
          items:
            type: string
            enum:
            - owner
            - listing
        description: include query parameter to allow the client to customize which
          related resources should be returned.
        explode: false
      - in: query
        name: fields[compsets]
        schema:
          type: array
          items:
            type: string
            enum:
            - listing-id
            - kind
            - title
            - member-count
            - created-at
            - updated-at
            - owner
            - listing
        description: endpoint return only specific fields in the response on a per-type
          basis by including a fields[TYPE] query parameter.
        explode: false
      tags:
      - Compsets
      security:
      - oauth2:
        - compsets:read
      - personalAccessToken: []
      responses:
        '200':
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/PaginatedCompsetSummaryList'
              examples:
                CompSetList:
                  value:
                    data:
                    - data:
                      - type: compsets
                        id: '55'
                        attributes:
                          listing-id: 123
                          kind: connected
                          title: Sunny 2BR near the beach
                          member-count: 8
                          created-at: '2026-06-10T14:22:00Z'
                          updated-at: '2026-08-01T09:00:00Z'
                        relationships:
                          owner:
                            data:
                              type: users
                              id: '456'
                          listing:
                            data:
                              type: listings
                              id: '123'
                      meta:
                        pagination:
                          page: 1
                          pages: 1
                          count: 1
                    links:
                      first: http://example.com/articles?page%5Bsize%5D=10&page%5Bnumber%5D=1
                      last: http://example.com/articles?page%5Bsize%5D=10&page%5Bnumber%5D=9
                      prev: http://example.com/articles?page%5Bsize%5D=10&page%5Bnumber%5D=1
                      next: http://example.com/articles?page%5Bsize%5D=10&page%5Bnumber%5D=3
                    meta:
                      pagination:
                        count: 42
                        page: 2
                        pages: 5
                  summary: Comp set list
          description: ''
        '401':
          description: Unauthorized - invalid or missing bearer token
        '403':
          description: Forbidden
        '429':
          description: Rate limit exceeded
        '500':
          description: Internal server error
  /api/v1/compsets/{compset_id}/:
    get:
      operationId: get_compset
      description: |-
        Return one comp set by id, fully enriched.

        **Required scope:** `compsets:read`

        Returns the comp set with members enriched across Airbnb, Vrbo, and
        Booking.com, the comp set's headline metrics over the next 30 and 90
        days, and a `performance` block comparing the listing to the aggregated
        compset benchmark over `start_date`..`end_date` (defaults: today →
        today+90d, max range 180 days).

        The `kind` field distinguishes `custom` and `connected` comp sets; for
        `custom` comp sets some `source` fields and the main-listing
        performance metrics are `null`.

        Returns **404** when no comp set with that id is visible to the client.
      summary: Get a comp set by id
      parameters:
      - in: path
        name: compset_id
        schema:
          type: integer
        required: true
      - in: query
        name: start_date
        schema:
          type: string
        description: First stay date (YYYY-MM-DD) for the performance comparison.
          Defaults to today.
      - in: query
        name: end_date
        schema:
          type: string
        description: Last stay date (YYYY-MM-DD) for the performance comparison. Defaults
          to today + 90 days. Range must not exceed 180 days.
      - in: query
        name: fields[compsets]
        schema:
          type: array
          items:
            type: string
            enum:
            - id
            - listing-id
            - kind
            - title
            - matched-airbnb-id
            - created-at
            - updated-at
            - source
            - members
            - performance
        description: endpoint return only specific fields in the response on a per-type
          basis by including a fields[TYPE] query parameter.
        explode: false
      tags:
      - Compsets
      security:
      - oauth2:
        - compsets:read
      - personalAccessToken: []
      responses:
        '200':
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/CompsetResponse'
              examples:
                CompSetDetail(oneMemberShown):
                  value:
                    data:
                      type: compsets
                      id: '55'
                      attributes:
                        listing-id: 123
                        kind: connected
                        title: Sunny 2BR near the beach
                        matched-airbnb-id: '987654321'
                        created-at: '2026-06-10T14:22:00Z'
                        updated-at: '2026-08-01T09:00:00Z'
                        source:
                          bedrooms: 2
                          bathrooms: 1.5
                          latitude: 37.7749
                          longitude: -122.4194
                          address: 123 Main St
                          city: San Francisco
                          state: CA
                          country: US
                          market: San Francisco
                          currency: USD
                          base-price: 189.0
                          health-score: 82
                          min-stay: 2
                          metrics:
                            thirty-day-price: 210.5
                            ninety-day-price: 195.0
                            thirty-day-adr: 205.0
                            ninety-day-adr: 188.0
                            thirty-day-booked: 71.4
                            ninety-day-booked: 63.0
                            thirty-day-availability: 28.6
                            ninety-day-availability: 37.0
                            thirty-day-min-stays: 2
                            ninety-day-min-stays: 2
                            rating: 4.9
                            reviews-count: 213
                            average-service-fee: 31.2
                        members:
                        - channel: airbnb
                          channel-listing-id: '13358898'
                          title: Bright loft downtown
                          url: https://www.airbnb.com/rooms/13358898
                          image: https://images.example.com/loft.jpg
                          bedrooms: 2.0
                          bathrooms: 1.0
                          room-type: entire_home
                          latitude: 37.7712
                          longitude: -122.4103
                          distance-km: 1.2
                          rating: 4.8
                          reviews-count: 145
                          health-score: 76.0
                          metrics:
                            thirty-day-adr: 198.0
                            ninety-day-adr: 182.0
                            thirty-day-booked: 66.7
                            ninety-day-booked: 58.9
                            thirty-day-availability: 33.3
                            ninety-day-availability: 41.1
                            thirty-day-min-stays: 2
                            ninety-day-min-stays: 2
                            thirty-day-adj-occupancy: 70.0
                            ninety-day-adj-occupancy: 61.0
                            thirty-day-booked-rate: 198.0
                            ninety-day-booked-rate: 182.0
                            base-price: 175.0
                            currency: USD
                            rating: 4.8
                            reviews-count: 145
                            average-service-fee: 28.4
                        performance:
                          start-date: '2026-08-10'
                          end-date: '2026-11-08'
                          currency: USD
                          main-listing-metrics:
                            average-posted-rate: 212.0
                            occupancy: 68.5
                            average-min-stay: 2.0
                            average-booked-rate: 204.0
                            adj-occupancy: 71.2
                          aggregated-metrics:
                            average-posted-rate: 197.0
                            occupancy: 61.3
                            average-min-stay: 2.1
                            average-booked-rate: 189.0
                            adj-occupancy: 64.8
                            number-of-nearby-listings: 8
                  summary: Comp set detail (one member shown)
          description: ''
        '400':
          description: Validation error
        '401':
          description: Unauthorized - invalid or missing bearer token
        '403':
          description: Forbidden
        '404':
          description: Not found - resource does not exist
        '429':
          description: Rate limit exceeded
        '500':
          description: Internal server error
  /api/v1/listings/:
    get:
      operationId: list_listings
      description: |-
        Retrieve a paginated list of all listings for the authenticated application.

        **Required scope:** `listings:read`

        **Pagination:** Use `page[number]` and `page[size]` query parameters.

        **Sorting:** Use `sort` query parameter with field names.
        Prefix with `-` for descending order.

        **Filtering:** Use `filter[field]` query parameters.

        **Compound documents:** Use `include` query parameter to include related resources.
      summary: List all listings
      parameters:
      - name: sort
        required: false
        in: query
        description: '[list of fields to sort by](https://jsonapi.org/format/#fetching-sorting)'
        schema:
          type: array
          items:
            type: string
            enum:
            - created-at
            - -created-at
            - title
            - -title
            - city
            - -city
        explode: false
      - in: query
        name: filter[owner]
        schema:
          type: number
      - in: query
        name: filter[enabled]
        schema:
          type: boolean
      - in: query
        name: filter[name]
        schema:
          type: string
      - in: query
        name: filter[market]
        schema:
          type: string
      - in: query
        name: filter[bedrooms]
        schema:
          type: integer
      - in: query
        name: filter[in-active-market]
        schema:
          type: boolean
      - name: page[number]
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page[size]
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: include
        schema:
          type: array
          items:
            type: string
            enum:
            - owner
        description: include query parameter to allow the client to customize which
          related resources should be returned.
        explode: false
      - in: query
        name: fields[listings]
        schema:
          type: array
          items:
            type: string
            enum:
            - title
            - image
            - neighborhood
            - city
            - state
            - country
            - market
            - room-type
            - bedrooms
            - bathrooms
            - base-price
            - base-price-updated-at
            - min-price
            - min-price-updated-at
            - max-price
            - min-stay
            - extra-guest-fee
            - extra-guest-threshold
            - latitude
            - longitude
            - timezone
            - currency
            - in-active-market
            - enabled
            - address
            - created-at
            - owner
            - channel-listings
        description: endpoint return only specific fields in the response on a per-type
          basis by including a fields[TYPE] query parameter.
        explode: false
      tags:
      - Listings
      security:
      - oauth2:
        - listings:read
      - oauth2:
        - beyond:read
      - oauth2:
        - beyond:write
      - personalAccessToken: []
      responses:
        '200':
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/PaginatedListingList'
              examples:
                ListingList:
                  value:
                    data:
                    - data:
                      - type: listings
                        id: '123'
                        attributes:
                          title: Sunny 2BR near the beach
                          image: https://images.example.com/listing-123.jpg
                          neighborhood: Mission District
                          city: San Francisco
                          state: CA
                          country: US
                          market: San Francisco
                          room-type: entire_home
                          bedrooms: 2
                          bathrooms: '1.50'
                          base-price: 189
                          base-price-updated-at: '2026-07-02T09:15:00Z'
                          min-price: 95
                          min-price-updated-at: '2026-07-02T09:15:00Z'
                          max-price: null
                          min-stay: 2
                          extra-guest-fee: 25
                          extra-guest-threshold: 4
                          latitude: '37.77490000'
                          longitude: '-122.41940000'
                          timezone: America/Los_Angeles
                          currency: USD
                          in-active-market: true
                          enabled: true
                          address: 123 Main St, San Francisco, CA
                          created-at: '2026-05-20T18:03:11Z'
                          channel-listings:
                          - channel: airbnb
                            channel-id: '987654321'
                        relationships:
                          owner:
                            data:
                              type: users
                              id: '456'
                      meta:
                        pagination:
                          page: 1
                          pages: 1
                          count: 1
                    links:
                      first: http://example.com/articles?page%5Bsize%5D=10&page%5Bnumber%5D=1
                      last: http://example.com/articles?page%5Bsize%5D=10&page%5Bnumber%5D=9
                      prev: http://example.com/articles?page%5Bsize%5D=10&page%5Bnumber%5D=1
                      next: http://example.com/articles?page%5Bsize%5D=10&page%5Bnumber%5D=3
                    meta:
                      pagination:
                        count: 42
                        page: 2
                        pages: 5
                  summary: Listing list
          description: ''
        '401':
          description: Unauthorized - invalid or missing bearer token
        '403':
          description: Forbidden
        '429':
          description: Rate limit exceeded
        '500':
          description: Internal server error
  /api/v1/listings/{listing_id}/:
    get:
      operationId: get_listing
      description: |-
        Retrieve detailed information about a specific listing.

        **Required scope:** `listings:read`

        **Compound documents (sideloading):**
        Use the `include` query parameter to include related resources in a single request.
        This follows the JSON:API specification for compound documents.

        Supported includes:
        - `owner` - The user who owns the listing

        **Example:** `GET /api/v1/listings/123/?include=owner`
      summary: Retrieve a listing by ID
      parameters:
      - in: path
        name: listing_id
        schema:
          type: integer
        required: true
      - in: query
        name: include
        schema:
          type: array
          items:
            type: string
            enum:
            - owner
        description: include query parameter to allow the client to customize which
          related resources should be returned.
        explode: false
      - in: query
        name: fields[listings]
        schema:
          type: array
          items:
            type: string
            enum:
            - title
            - image
            - neighborhood
            - city
            - state
            - country
            - market
            - room-type
            - bedrooms
            - bathrooms
            - base-price
            - base-price-updated-at
            - min-price
            - min-price-updated-at
            - max-price
            - min-stay
            - extra-guest-fee
            - extra-guest-threshold
            - latitude
            - longitude
            - timezone
            - currency
            - in-active-market
            - enabled
            - address
            - created-at
            - owner
            - channel-listings
            - sync-status
        description: endpoint return only specific fields in the response on a per-type
          basis by including a fields[TYPE] query parameter.
        explode: false
      tags:
      - Listings
      security:
      - oauth2:
        - listings:read
      - oauth2:
        - beyond:read
      - oauth2:
        - beyond:write
      - personalAccessToken: []
      responses:
        '200':
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ListingDetailResponse'
              examples:
                ListingDetail:
                  value:
                    data:
                      type: listings
                      id: '123'
                      attributes:
                        title: Sunny 2BR near the beach
                        image: https://images.example.com/listing-123.jpg
                        neighborhood: Mission District
                        city: San Francisco
                        state: CA
                        country: US
                        market: San Francisco
                        room-type: entire_home
                        bedrooms: 2
                        bathrooms: '1.50'
                        base-price: 189
                        base-price-updated-at: '2026-07-02T09:15:00Z'
                        min-price: 95
                        min-price-updated-at: '2026-07-02T09:15:00Z'
                        max-price: null
                        min-stay: 2
                        extra-guest-fee: 25
                        extra-guest-threshold: 4
                        latitude: '37.77490000'
                        longitude: '-122.41940000'
                        timezone: America/Los_Angeles
                        currency: USD
                        in-active-market: true
                        enabled: true
                        address: 123 Main St, San Francisco, CA
                        created-at: '2026-05-20T18:03:11Z'
                        channel-listings:
                        - channel: airbnb
                          channel-id: '987654321'
                        sync-status:
                          state: completed
                          last-successful-sync-at: '2026-08-09T04:12:44Z'
                      relationships:
                        owner:
                          data:
                            type: users
                            id: '456'
                  summary: Listing detail
          description: ''
        '401':
          description: Unauthorized - invalid or missing bearer token
        '403':
          description: Forbidden
        '404':
          description: Not found - resource does not exist
        '429':
          description: Rate limit exceeded
        '500':
          description: Internal server error
  /api/v1/listings/{listing_id}/activation/:
    patch:
      operationId: patch_listing_activation
      description: Enable or disable price syncing for a listing.
      summary: Update listing activation
      parameters:
      - in: path
        name: listing_id
        schema:
          type: integer
        required: true
      tags:
      - Listings
      requestBody:
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/PatchedListingActivationRequest'
            examples:
              EnablePriceSyncing:
                value:
                  data:
                    type: listing-activations
                    id: '123'
                    attributes:
                      enabled: true
                      base-price: 189
                      min-price: 95
                summary: Enable price syncing
        required: true
      security:
      - oauth2:
        - listings:write
      - personalAccessToken: []
      responses:
        '200':
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ListingActivationResponse'
          description: ''
        '304':
          description: Not modified
        '400':
          description: Validation error
        '401':
          description: Unauthorized - invalid or missing bearer token
        '403':
          description: Forbidden
        '404':
          description: Not found - resource does not exist
        '422':
          description: Unprocessable entity
        '429':
          description: Rate limit exceeded
        '500':
          description: Internal server error
  /api/v1/listings/{listing_id}/calendar/:
    get:
      operationId: list_listing_calendar
      description: |-
        Retrieve the pricing calendar for a specific listing.

        **Required scope:** `reservations:read`

        **Currency:** Price fields are returned in the listing's own currency,
        the one the listings endpoint reports as `currency`. It is not the
        owner's billing currency, which is what market insights are priced in.

        **Date range:** Use `filter[start-date]` and `filter[end-date]` query parameters
        (YYYY-MM-DD, JSON:API spec). Defaults to today through today + 365 days.

        **Sorting:** Use `sort=date` (ascending, default) or `sort=-date`.

        **Pagination:** Use `page[number]` and `page[size]` query parameters.

        **Sparse fieldsets:** Use `fields[calendar-entries]` to select specific fields.

        **Example:** `GET /api/v1/listings/123/calendar/?filter[start-date]=2026-01-01&filter[end-date]=2026-06-30&sort=date`
      summary: Get calendar for a listing
      parameters:
      - in: path
        name: listing_id
        schema:
          type: integer
        required: true
      - name: page[number]
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page[size]
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: filter[start-date]
        schema:
          type: string
          format: date
        description: Start date (YYYY-MM-DD). Defaults to today in the listing's timezone.
      - in: query
        name: filter[end-date]
        schema:
          type: string
          format: date
        description: End date (YYYY-MM-DD). Defaults to today + 365 days.
      - in: query
        name: sort
        schema:
          type: string
          enum:
          - -date
          - date
        description: 'Sort calendar entries by date. Supported values: date, -date.
          Defaults to date.'
      - in: query
        name: fields[calendar-entries]
        schema:
          type: array
          items:
            type: string
            enum:
            - id
            - date
            - availability
            - price
            - price-posted
            - effective-min-price
            - effective-max-price
            - price-override-type
            - factors
        description: endpoint return only specific fields in the response on a per-type
          basis by including a fields[TYPE] query parameter.
        explode: false
      tags:
      - Listings
      security:
      - oauth2:
        - reservations:read
      - oauth2:
        - beyond:read
      - personalAccessToken: []
      responses:
        '200':
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/PaginatedCalendarEntryList'
              examples:
                CalendarEntries:
                  value:
                    data:
                    - data:
                      - type: calendar-entries
                        id: '2026-03-10'
                        attributes:
                          date: '2026-03-10'
                          availability: available
                          price: 101
                          price-posted: 100
                          effective-min-price: 80
                          effective-max-price: 250
                          price-override-type: null
                          factors:
                          - key: seasonality
                            order: 1
                            ratio: 0.12
                            amount: 11
                          - key: event
                            order: 2
                            ratio: 0.05
                            amount: 5
                            reason: City Marathon
                            event-impact: high
                          - key: feature_occupancy_premium
                            order: 3
                            ratio: 0.03
                            amount: 3
                            metadata:
                              listing-occupancy: 45.45
                              market-occupancy: 27.32
                      meta:
                        pagination:
                          page: 1
                          pages: 1
                          count: 1
                    links:
                      first: http://example.com/articles?page%5Bsize%5D=10&page%5Bnumber%5D=1
                      last: http://example.com/articles?page%5Bsize%5D=10&page%5Bnumber%5D=9
                      prev: http://example.com/articles?page%5Bsize%5D=10&page%5Bnumber%5D=1
                      next: http://example.com/articles?page%5Bsize%5D=10&page%5Bnumber%5D=3
                    meta:
                      pagination:
                        count: 42
                        page: 2
                        pages: 5
                  summary: Calendar entries
          description: ''
        '401':
          description: Unauthorized - invalid or missing bearer token
        '403':
          description: Forbidden
        '404':
          description: Not found - resource does not exist
        '422':
          description: Unprocessable - invalid dates or insufficient data
        '429':
          description: Rate limit exceeded
        '500':
          description: Internal server error
  /api/v1/listings/{listing_id}/change-history/:
    get:
      operationId: list_listing_changes
      description: |-
        List the changes made to a listing's settings, newest first.

        **Required scope:** `listings:read`

        Covers every surface: the Beyond API, the Beyond app, the Beyond MCP
        server, and Beyond itself. Each change lists the settings written
        together, with a human-readable description of the new state; the
        previous value is not recorded. `source` and `changed-by` say where and
        by whom, as the dashboard's history shows them.
        Narrow the window with `filter[changed-after]` / `filter[changed-before]`.
      summary: List a listing's change history
      parameters:
      - in: path
        name: listing_id
        schema:
          type: integer
        required: true
      - in: query
        name: filter[changed-after]
        schema:
          type: string
          format: date-time
      - in: query
        name: filter[changed-before]
        schema:
          type: string
          format: date-time
      - name: page[number]
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page[size]
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: fields[listing-changes]
        schema:
          type: array
          items:
            type: string
            enum:
            - id
            - changed-at
            - source
            - changed-by
            - changes
        description: endpoint return only specific fields in the response on a per-type
          basis by including a fields[TYPE] query parameter.
        explode: false
      tags:
      - Listings
      security:
      - oauth2:
        - listings:read
      - personalAccessToken: []
      responses:
        '200':
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/PaginatedListingChangeList'
              examples:
                ChangeHistory:
                  value:
                    data:
                    - data:
                      - type: listing-changes
                        id: '88213'
                        attributes:
                          changed-at: '2026-09-21T14:03:11Z'
                          source: beyond-api
                          changed-by: ops@example.com
                          changes:
                          - setting: base-price
                            description: Set Base Price to 150
                          - setting: min-price
                            description: Set Min Price to 90
                      - type: listing-changes
                        id: '88160'
                        attributes:
                          changed-at: '2026-09-19T17:22:40Z'
                          source: listing-customize
                          changed-by: host@example.com
                          changes:
                          - setting: seasonal-min-stays
                            description: Set Min Stay to 3 from 2026-12-20 to 2027-01-03
                      - type: listing-changes
                        id: '88107'
                        attributes:
                          changed-at: '2026-09-18T08:40:52Z'
                          source: internal-tools
                          changed-by: support@beyondpricing.com
                          changes:
                          - setting: max-stay
                            description: Set Max Stay to 30
                      meta:
                        pagination:
                          page: 1
                          pages: 1
                          count: 3
                    links:
                      first: http://example.com/articles?page%5Bsize%5D=10&page%5Bnumber%5D=1
                      last: http://example.com/articles?page%5Bsize%5D=10&page%5Bnumber%5D=9
                      prev: http://example.com/articles?page%5Bsize%5D=10&page%5Bnumber%5D=1
                      next: http://example.com/articles?page%5Bsize%5D=10&page%5Bnumber%5D=3
                    meta:
                      pagination:
                        count: 42
                        page: 2
                        pages: 5
                  summary: Change history
