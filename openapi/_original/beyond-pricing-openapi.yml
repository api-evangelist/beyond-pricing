    AccountRefreshedEventAttributes:
      type: object
      description: |-
        Dasherizes field names on output and un-dasherizes on input.

        Apply to nested (non-resource) serializers so their keys match
        the top-level JSON:API dasherized format. Top-level resource
        serializers must NOT use this mixin (the renderer handles them).
      properties:
        status:
          enum:
          - succeeded
          - failed
          type: string
          description: |-
            Terminal outcome of the refresh. 'succeeded' means every listing the refresh considered synced without error; 'failed' means at least one listing failed, or the sync itself did not complete.

            * `succeeded` - succeeded
            * `failed` - failed
        completed-at:
          type: string
          format: date-time
          description: UTC timestamp when the refresh reached its terminal state (RFC
            3339)
        channel:
          type: string
          description: Channel the account is connected to (e.g. 'airbnb', 'hostaway').
        nb-listings-synced:
          type: integer
          description: Number of listings the refresh successfully re-synced. Listings
            skipped as recently synced are not counted, so this can be lower than
            the account's listing count — and 0 when everything was skipped.
        nb-listings-failed:
          type:
          - integer
          - 'null'
          description: Number of listings the refresh could not sync. Always present;
            0 when status='succeeded'. It is null when the sync did not run to completion
            (for example an infrastructure failure or a channel-wide error), so the
            per-listing count is unknown — in that case nb-listings-synced reports
            how many listings exist on the account, and status is 'failed'.
        recent-sync-threshold-minutes:
          type: integer
          description: The threshold the refresh ran with, echoed from the request.
            Listings synced within this many minutes were skipped. 0 means no listing
            was skipped.
        error:
          type:
          - string
          - 'null'
          description: Short, human-readable failure description. Present only when
            status='failed'. Stable across retries of the same delivery.
      required:
      - channel
      - completed-at
      - nb-listings-failed
      - nb-listings-synced
      - recent-sync-threshold-minutes
      - status
