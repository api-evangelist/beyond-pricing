              enum:
              - fixed
              - percentage
              - null
              type:
              - string
              - 'null'
              description: How `price` was set for this date, when a manual override applies. `fixed` means a partner or user pinned the price and Beyond no longer reprices the date. `percentage` means a percentage adjustment is applied on top of the modeled price, which keeps moving. Null when the price is purely modeled. Override values are managed through `/customizations/manual-overrides/`.
              readOnly: true
            factors:
              type: array
              items:
                $ref: '#/components/schemas/Factor'
              description: Pricing factors that contribute to the modeled price
